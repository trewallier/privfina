# PR / push validation — least privilege, no deploy, no secrets.
# Required status check name: validate
name: CI

# Deny all by default; jobs grant only what they need (ADR 0007).
permissions: {}

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Triggers cannot express "default branch" dynamically; filter here instead of hardcoding master.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch) ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library (tsc)
        run: npm run build:lib

      - name: Build SPA (Vite)
        run: npm run build
