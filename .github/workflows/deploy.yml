# Publish dist-web to GitHub Pages — default-branch push only.
# Requires repo Pages source = GitHub Actions (see docs/dev-playbooks/ci-and-supply-chain.md).
name: Deploy to GitHub Pages

# Deny all by default; jobs grant only what they need (ADR 0007).
permissions: {}

on:
  push:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library (tsc)
        run: npm run build:lib

      - name: Build SPA (Vite)
        run: npm run build

      # Same-origin SPA fetch of published market JSON (ADR 0034 / ROADMAP §6b).
      # Soft-fail: missing market-data branch must not block product Pages deploys.
      - name: Checkout market-data tip
        id: market_data_checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          path: market-data-tree
          sparse-checkout: data/market/v1
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize market data into Pages artifact
        if: steps.market_data_checkout.outcome == 'success'
        run: |
          if [ -d market-data-tree/data/market/v1 ]; then
            mkdir -p dist-web/data/market
            cp -a market-data-tree/data/market/v1 dist-web/data/market/
            echo "Materialized data/market/v1 into dist-web"
          else
            echo "::warning::market-data tip checked out but data/market/v1 is missing; SPA will degrade to manual entry"
          fi

      - name: Warn when market-data materialization skipped
        if: steps.market_data_checkout.outcome != 'success'
        run: echo "::warning::market-data branch unavailable; Pages artifact ships without data/market/v1 (SPA manual-entry degrade)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-web

  deploy:
    needs: build
    # needs + if: skipped build does not run deploy; still gate on default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
