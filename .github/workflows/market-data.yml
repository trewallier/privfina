# Scheduled ÁKK → compact data/market/v1 on the market-data branch (ADR 0034 / ROADMAP §6b).
#
# Security split (GitHub least-privilege guidance):
# - ingest: contents:read only; contacts ÁKK; never holds a write token
# - publish: contents:write; consumes the ingest artifact only; does not call ÁKK
# Multistep git/Node logic lives in tested tools/market-data CLI commands (no multiline run: blocks).
# Paths are passed via env (not interpolated into run:) per GitHub script-injection guidance.
name: Market data ingest

# Deny all by default; jobs grant only what they need (ADR 0007).
permissions: {}

on:
  schedule:
    # ~17:30 UTC weekdays — after typical quote publish; settleDate comes from the API response.
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
      as_of: ${{ steps.ingest.outputs.as_of }}
    steps:
      - name: Checkout default branch (tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout market-data baseline (optional)
        id: baseline
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          path: baseline
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Fetch, normalize, and stage published tree
        id: ingest
        working-directory: app
        env:
          MARKET_BASELINE_ROOT: ${{ github.workspace }}/baseline
          MARKET_OUT_ROOT: ${{ github.workspace }}/out
          MARKET_RAW_DIR: ${{ runner.temp }}/akk-raw
        run: node --experimental-strip-types tools/market-data/cli.ts ci-ingest

      - name: Upload published market-data artifact
        if: steps.ingest.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-data-v1
          path: out/data/market/v1
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch (tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout market-data branch
        id: data
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          path: market-data
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Ensure market-data clone is pushable
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MARKET_DATA_PATH: ${{ github.workspace }}/market-data
          MARKET_DATA_BRANCH: market-data
        run: node --experimental-strip-types tools/market-data/cli.ts ensure-data-clone

      - name: Download published market-data artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: market-data-v1
          path: market-data/data/market/v1

      - name: Re-validate published tree before commit
        working-directory: app
        env:
          MARKET_TREE_ROOT: ${{ github.workspace }}/market-data
        run: node --experimental-strip-types tools/market-data/cli.ts validate-tree

      - name: Commit and push market-data tip
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_DATA_PATH: ${{ github.workspace }}/market-data
          MARKET_DATA_BRANCH: market-data
        run: node --experimental-strip-types tools/market-data/cli.ts commit-push
