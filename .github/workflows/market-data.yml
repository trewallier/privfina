# Scheduled ÁKK + allampapir.hu + KSH inflation + MNB BUBOR + MNB settlement calendar
# + WebKincstár daily price PDFs + ÁKK public-offering capture → compact data/market/v2
# on the market-data branch
# (ADR 0034 / 0035 / 0036 / 0037 / 0039 / 0041 / 0045 / 0046 /
#  ROADMAP §6b–§6e / §6h / §6k / §6o / §6p).
#
# Security split:
# - ingest: contents:read; contacts ÁKK + allampapir.hu (prices + retailInterest kamatok
#   + offering PDF fallback) + KSH STADAT ara0040 CSV + MNB bubor2.xls
#   + MNB elszámolásforgalmi XLSX + WebKincstár report-service PDFs
#   + ÁKK getPublicOfferings (+ documents.akk.hu PDFs, ≤20/family);
#   Poppler pdftotext; never holds a write token
# - push: GitHub App installation token only (not GITHUB_TOKEN) for market-data checkout/push;
#   does not call ÁKK, allampapir.hu, ksh.hu, mnb.hu, WebKincstár, or documents.akk.hu
# Paths via env; single-line run: steps; TS via lockfile-local tsx (not --experimental-strip-types).
name: Market data ingest

permissions: {}

on:
  schedule:
    # Daily: securities quotes + KSH inflation + MNB BUBOR + settlement calendar
    # + WebKincstár prices + offerings (write only when digests change).
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      reparse_parse_failed:
        description: "Re-download ISSUE PDFs previously sticky parse_failed (after parser fix)"
        required: false
        type: boolean
        default: false

concurrency:
  group: market-data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
      as_of: ${{ steps.ingest.outputs.as_of }}
      baseline_exists: ${{ steps.resolve_baseline.outputs.exists }}
      offering_pdfs_downloaded: ${{ steps.ingest.outputs.offering_pdfs_downloaded }}
      offering_pdfs_pending: ${{ steps.ingest.outputs.offering_pdfs_pending }}
      offering_pdfs_parse_failed: ${{ steps.ingest.outputs.offering_pdfs_parse_failed }}
      offering_pdfs_skipped_no_schedule: ${{ steps.ingest.outputs.offering_pdfs_skipped_no_schedule }}
      offering_pdfs_tip: ${{ steps.ingest.outputs.offering_pdfs_tip }}
      offering_pdfs_bf: ${{ steps.ingest.outputs.offering_pdfs_bf }}
      offering_queue_tip: ${{ steps.ingest.outputs.offering_queue_tip }}
      offering_queue_bf: ${{ steps.ingest.outputs.offering_queue_bf }}
      offering_pending_tip: ${{ steps.ingest.outputs.offering_pending_tip }}
      offering_pending_bf: ${{ steps.ingest.outputs.offering_pending_bf }}
      offering_backfill_frontier: ${{ steps.ingest.outputs.offering_backfill_frontier }}
      offering_gate_frontier: ${{ steps.ingest.outputs.offering_gate_frontier }}
      offerings_soft_failed: ${{ steps.ingest.outputs.offerings_soft_failed }}
      webkincstar_fetch_failed_days: ${{ steps.ingest.outputs.webkincstar_fetch_failed_days }}
      webkincstar_historical_enabled: ${{ steps.ingest.outputs.webkincstar_historical_enabled }}
      webkincstar_historical_gate_open: ${{ steps.ingest.outputs.webkincstar_historical_gate_open }}
      webkincstar_datums_fetched: ${{ steps.ingest.outputs.webkincstar_datums_fetched }}
      webkincstar_overlay_skipped: ${{ steps.ingest.outputs.webkincstar_overlay_skipped }}
      webkincstar_series_invented: ${{ steps.ingest.outputs.webkincstar_series_invented }}
      webkincstar_soft_failed: ${{ steps.ingest.outputs.webkincstar_soft_failed }}
      retail_interest_soft_failed: ${{ steps.ingest.outputs.retail_interest_soft_failed }}
    steps:
      - name: Checkout default branch (tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Cache pinned Poppler debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/tools/market-data/.poppler-debs
          key: poppler-debs-${{ hashFiles('app/tools/market-data/poppler.manifest') }}

      - name: Install Poppler (pinned + hash-verified)
        working-directory: app
        env:
          POPPLER_DEB_DIR: ${{ github.workspace }}/app/tools/market-data/.poppler-debs
        run: bash tools/market-data/scripts/install-poppler.sh

      - name: Resolve market-data baseline branch
        id: resolve_baseline
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MARKET_DATA_BRANCH: market-data
        run: ./node_modules/.bin/tsx tools/market-data/cli.ts resolve-branch

      - name: Checkout market-data baseline
        if: steps.resolve_baseline.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          path: baseline
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch, normalize, and stage published tree
        id: ingest
        working-directory: app
        env:
          MARKET_BASELINE_ROOT: ${{ github.workspace }}/baseline
          MARKET_OUT_ROOT: ${{ github.workspace }}/out
          MARKET_RAW_DIR: ${{ runner.temp }}/market-raw
          MARKET_REPARSE_PARSE_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.reparse_parse_failed && '1' || '' }}
        run: ./node_modules/.bin/tsx tools/market-data/cli.ts ci-ingest

      - name: Upload published market-data artifact
        if: steps.ingest.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-data-v2
          path: out/data/market/v2
          if-no-files-found: error
          retention-days: 7

  push:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    # GITHUB_TOKEN stays read-only; write access comes from the App installation token.
    permissions:
      contents: read
    steps:
      - name: Require MARKET_DATA_APP_CLIENT_ID
        env:
          MARKET_DATA_APP_CLIENT_ID: ${{ vars.MARKET_DATA_APP_CLIENT_ID }}
        run: if [ -z "${MARKET_DATA_APP_CLIENT_ID}" ]; then echo "Repository variable MARKET_DATA_APP_CLIENT_ID is required before push" >&2; exit 1; fi

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MARKET_DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARKET_DATA_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve App bot user id
        id: bot_user
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" && echo "user-id=${user_id}" >> "${GITHUB_OUTPUT}"

      - name: Checkout default branch (tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Resolve market-data branch (App token)
        id: resolve_data
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MARKET_DATA_BRANCH: market-data
        run: ./node_modules/.bin/tsx tools/market-data/cli.ts resolve-branch

      - name: Checkout market-data branch
        if: steps.resolve_data.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          path: market-data
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Ensure market-data clone is pushable
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MARKET_DATA_PATH: ${{ github.workspace }}/market-data
          MARKET_DATA_BRANCH: market-data
          MARKET_BRANCH_EXISTS: ${{ steps.resolve_data.outputs.exists }}
          MARKET_DATA_BOT_USER_ID: ${{ steps.bot_user.outputs.user-id }}
          MARKET_DATA_GIT_NAME: ${{ steps.app_token.outputs.app-slug }}[bot]
        run: bash tools/market-data/scripts/ensure-clone.sh

      # Prune before extract: writeMarketTree also deletes orphans, but an overlay
      # extract onto a prior tip can leave ghost coupons/quotes when the join set shrinks.
      - name: Clear previous published v2 tree
        env:
          MARKET_DATA_PATH: ${{ github.workspace }}/market-data
        run: rm -rf "${MARKET_DATA_PATH}/data/market/v2"

      - name: Download published market-data artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: market-data-v2
          path: market-data/data/market/v2

      - name: Re-validate published tree before commit
        working-directory: app
        env:
          MARKET_TREE_ROOT: ${{ github.workspace }}/market-data
        run: ./node_modules/.bin/tsx tools/market-data/cli.ts validate-tree

      - name: Commit and push market-data tip
        working-directory: app
        env:
          MARKET_DATA_PATH: ${{ github.workspace }}/market-data
          MARKET_DATA_BRANCH: market-data
        run: bash tools/market-data/scripts/commit-push.sh
