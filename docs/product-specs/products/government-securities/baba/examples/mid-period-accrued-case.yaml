specVersion: v2alpha3
productId: government-security.baba.standard
exampleId: mid-period-accrued-case
title: Mid first-period Babakötvény 2045/S purchase with accrued
description: Purchase inside the short first period; accrued uses ACT/ACT days from issue over the regular year denominator (dt1→firstCoupon = 365).

inputs:
  principal: 1000000
  annualCouponRatePct: 7.4
  purchaseDate: 2026-08-01
  issueDate: 2026-02-02
  maturityDate: 2045-02-01
  firstCouponDate: 2027-02-01
  dayCountConvention: ACT/ACT

expected:
  annualCouponRatePct: 7.4
  # ga × (ds − d0) / (d1 − dt1) = 0.074 × 180 / 365
  accruedInterestAmount: 36493.150684931506
  purchaseAmount: 1036493.1506849315

notes:
  - Issue 2026-02-02 is one day after technical anniversary dt1 2026-02-01 (short first period, d0 > dt1).
  - Accrual numer = 180 days (2026-02-02 → 2026-08-01); denom = 365 (2026-02-01 → 2027-02-01).
  - Offering price = par + accrued after the first offering day.
