specVersion: v2alpha3
productId: government-security.baba.standard
exampleId: mid-period-after-coupon-case
title: Mid-holding Babakötvény 2045/S purchase after first coupon
description: Purchase after the first cash coupon; accrued from last payment 2027-02-01 using regular ACT/ACT period fraction through next anniversary.

inputs:
  principal: 1000000
  annualCouponRatePct: 7.4
  purchaseDate: 2027-08-01
  issueDate: 2026-02-02
  maturityDate: 2045-02-01
  firstCouponDate: 2027-02-01
  dayCountConvention: ACT/ACT

expected:
  annualCouponRatePct: 7.4
  # ga × (ds − lastPay) / (nextPay − lastPay) = 0.074 × 181 / 365
  accruedInterestAmount: 36695.890410958906
  purchaseAmount: 1036695.8904109589

notes:
  - Accrual starts at last payment 2027-02-01, not at issue.
  - Numer = 181 days (2027-02-01 → 2027-08-01); denom = 365 (2027-02-01 → 2028-02-01).
  - On a coupon payment date, accrued is zero.
