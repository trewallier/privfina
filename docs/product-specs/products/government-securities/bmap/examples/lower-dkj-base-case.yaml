specVersion: v2alpha3
productId: government-security.bmap.standard
exampleId: lower-dkj-base-case
title: Low effective-rate BMAP example
description: Scenario with a low published effective coupon (historically a floored DKJ base plus premium).

inputs:
  principal: 1000000
  annualCouponRatePct: 0.75
  purchaseDate: 2026-08-01
  issueDate: 2026-08-01
  maturityDate: 2032-08-01
  dayCountConvention: ACT/360

expected:
  annualCouponRatePct: 0.75
  purchaseAmount: 1000000

notes:
  - Commercial path uses the effective period rate; base-floor composition is not a required composer input.
