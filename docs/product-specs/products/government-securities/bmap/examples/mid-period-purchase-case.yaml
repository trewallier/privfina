specVersion: v2alpha3
productId: government-security.bmap.standard
exampleId: mid-period-purchase-case
title: Mid-period secondary purchase accrued interest
description: Accrued interest starts from the previous coupon date on/before purchase, not from issue.

inputs:
  principal: 1000000
  annualCouponRatePct: 6.88
  issueDate: 2024-03-22
  purchaseDate: 2026-05-15
  maturityDate: 2030-03-22
  dayCountConvention: ACT/360
  couponSchedule:
    - from: 2025-03-22
      to: 2026-03-21
      rate: 6.5
    - from: 2026-03-22
      to: 2027-03-21
      rate: 6.88

expected:
  annualCouponRatePct: 6.88
  # 54 ACT days from 2026-03-22 to 2026-05-15 at 6.88% on 1_000_000 / 360
  accruedInterestAmount: 10320
  purchaseAmount: 1010320

notes:
  - Accrual must not restart at issueDate when a prior coupon period covers the purchase.
  - Calculators must not invent a fixed +6 year maturity.
