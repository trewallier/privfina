specVersion: v2alpha3
productId: government-security.bmap.standard
exampleId: nominal-case
title: Nominal BMAP example
description: Baseline BMAP scenario with published effective coupon rate and series maturity.

inputs:
  principal: 1000000
  annualCouponRatePct: 6.88
  purchaseDate: 2026-04-24
  issueDate: 2026-04-24
  maturityDate: 2032-04-24
  dayCountConvention: ACT/360

expected:
  annualCouponRatePct: 6.88
  purchaseAmount: 1000000

notes:
  - Effective coupon rate is supplied directly (historically equivalent to 6.13 DKJ base + 0.75 premium).
  - Maturity is series-authored; calculators must not invent a fixed 6-year term.
