specVersion: v1alpha1
productId: government-security.bmap.standard
exampleId: nominal-case
title: Nominal BMAP example
description: Baseline BMAP scenario with explicit DKJ base-yield input.

inputs:
  principal: 1000000
  dkjBaseYieldPct: 6.13
  interestPremiumPct: 0.75
  startDate: 2026-04-24
  purchaseDate: 2026-04-24

expected:
  effectiveDkjBaseYieldPct: 6.13
  annualCouponRatePct: 6.88
  couponPaymentFrequency: quarterly
  redemptionValue: 1000000

notes:
  - Coupon rate is represented as effective DKJ base yield plus fixed premium for this acceptance scenario.
