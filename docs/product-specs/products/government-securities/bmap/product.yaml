specVersion: v2alpha1
kind: financial-product
id: government-security.bmap.standard
family: government-security
variant: bmap
productCode: bmap
displayName: Bonus Hungarian Government Security (BMÁP)
description: Hungarian retail government bond with variable coupon linked to 3-month DKJ auction yields and quarterly interest payment.

category: retail-government-bond
denominationCurrency: HUF
denominationUnit: 1
issuanceModel: phased-public-offering
yieldModel: coupon-plus-redemption
couponModel: quarterly-variable
referenceIndex: weighted-3m-dkj-auction-average
offeringPriceModel: par-plus-accrued-interest
earlyRedemptionByIssuer: false
rateSettingRule: weighted-average-last-four-successful-3m-dkj-auctions
investorEligibility: natural-persons-primary-market
transferRestrictions: collateral-purpose-transfer-restricted

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Invested nominal amount.
    constraints:
      minimum: 1

  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Effective annual coupon rate for the applicable interest period (combined period kamat as published).
    constraints:
      minimum: 0
      maximum: 100

  - name: purchaseDate
    type: string
    label: Purchase Date
    required: true
    unit: date
    description: Purchase or valuation date in ISO format, used for accrued-interest-related calculations.

  - name: issueDate
    type: string
    label: Issue Date
    required: true
    unit: date
    description: Issue date of the BMAP series in ISO format.

  - name: maturityDate
    type: string
    label: Maturity Date
    required: true
    unit: date
    description: Maturity date of the BMAP series in ISO format.

  - name: startDate
    type: string
    label: Start Date
    required: false
    unit: date
    description: Investment start date in ISO format; defaults to issue date when omitted.

  - name: firstCouponDate
    type: string
    label: First Coupon Date
    required: false
    unit: date
    description: First coupon payment date in ISO format when a full couponSchedule is not supplied.

  - name: dayCountConvention
    type: string
    label: Day Count Convention
    required: false
    unit: text
    description: Interest day-count convention for accrued interest (default ACT/360).
    constraints:
      enum: [ACT/360, ACT/365F, 30E/360]

  - name: couponSchedule
    type: array
    label: Coupon Schedule
    required: false
    unit: text
    description: Optional list of coupon periods `{ from, to?, rate? }`; future rates may be omitted.

outputs:
  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Effective annual coupon rate used for the current period.

  - name: accruedInterestAmount
    type: number
    label: Accrued Interest
    required: false
    unit: currency
    description: Interest accrued from issue or previous coupon date to purchase or valuation date.

  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: false
    unit: currency
    description: Purchase amount based on principal plus accrued interest, where applicable.

assumptions:
  - BMAP is modeled as a quarterly-pay variable-rate retail government bond.
  - Commercial inputs use the published effective period coupon rate; base+premium composition is not required for composer autofill.
  - Coupon payment frequency is quarterly (product-type constant; not a calculated output).
  - Offering price is par on the first day of offering and par plus accrued interest afterwards.
  - BMAP denomination unit is 1 HUF; commercial composer principal defaults to that unit and accepts only multiples of it.
  - Default day-count for accrued-interest and period coupon calculations is ACT/360 unless overridden per series or input.
  - Maturity comes from the series / input; calculators must not invent a fixed term length.
  - Coupon schedule periods without a published rate do not invent cash flows.
  - Principal is repaid at maturity in one amount (redemption equals principal).
  - The issuer does not redeem BMAP before maturity.
  - Primary-market acquisition is limited to natural persons.
  - Collateral-purpose transfer is out of scope and restricted by the official product rules.
  - Live DKJ auction base derivation (`refs/dkj-base.json`) remains future work.

ui:
  formTitle: Bonus Hungarian Government Security (BMÁP)
  sections:
    - id: bmap-core
      title: BMAP Inputs
      fieldNames:
        - principal
        - purchaseDate
        - annualCouponRatePct
        - issueDate
        - maturityDate
        - startDate
        - firstCouponDate
        - dayCountConvention

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/lower-dkj-base-case.yaml
