specVersion: v1alpha1
kind: financial-product
id: government-security.bmap.standard
family: government-security
variant: bmap
displayName: Bonus Hungarian Government Security
description: Hungarian retail government bond with variable coupon linked to 3-month DKJ auction yields and quarterly interest payment.

category: retail-government-bond
denominationCurrency: HUF
denominationUnit: 1
issuanceModel: phased-public-offering
yieldModel: coupon-plus-redemption
couponModel: quarterly-variable
referenceIndex: weighted-3m-dkj-auction-average
offeringPriceModel: par-plus-accrued-interest
earlyRedemptionByIssuer: false
rateSettingRule: weighted-average-last-four-successful-3m-dkj-auctions
investorEligibility: natural-persons-primary-market
transferRestrictions: collateral-purpose-transfer-restricted

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Invested nominal amount.
    constraints:
      minimum: 1

  - name: dkjBaseYieldPct
    type: number
    label: DKJ Base Yield
    required: true
    unit: percent
    description: Base yield derived from 3-month DKJ auction averages.
    constraints:
      minimum: -100
      maximum: 100

  - name: interestPremiumPct
    type: number
    label: Interest Premium
    required: true
    unit: percent
    description: Fixed premium added on top of the DKJ-based yield.
    constraints:
      minimum: 0
      maximum: 100

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Investment start date in ISO format.

  - name: purchaseDate
    type: string
    label: Purchase Date
    required: false
    unit: date
    description: Purchase or valuation date in ISO format, used for accrued-interest-related calculations.

  - name: issueDate
    type: string
    label: Issue Date
    required: false
    unit: date
    description: Issue date of the BMAP series in ISO format.

  - name: firstCouponDate
    type: string
    label: First Coupon Date
    required: false
    unit: date
    description: First coupon payment date in ISO format if known.

outputs:
  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Annual coupon rate for the current period, equal to effective DKJ base plus premium.

  - name: couponPaymentFrequency
    type: string
    label: Coupon Payment Frequency
    required: true
    unit: text
    description: Frequency of coupon payments.

  - name: effectiveDkjBaseYieldPct
    type: number
    label: Effective DKJ Base Yield
    required: true
    unit: percent
    description: DKJ coupon base after applying the 0% floor.

  - name: periodCouponRatePct
    type: number
    label: Period Coupon Rate
    required: false
    unit: percent
    description: Coupon amount or rate applicable to the current coupon period using the 360-day convention.

  - name: accruedInterestAmount
    type: number
    label: Accrued Interest
    required: false
    unit: currency
    description: Interest accrued from issue or previous coupon date to purchase or valuation date.

  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: false
    unit: currency
    description: Purchase amount based on principal plus accrued interest, where applicable.

  - name: redemptionValue
    type: number
    label: Redemption Value
    required: true
    unit: currency
    description: Principal repaid at maturity.

assumptions:
  - BMAP is modeled as a quarterly-pay variable-rate retail government bond.
  - Product-term intent in this pilot is 6 years.
  - Annual coupon rate is effective DKJ base yield plus fixed premium.
  - Effective DKJ base yield is max(raw DKJ-based rate, 0).
  - The DKJ-based rate is conceptually tied to the last four successful 3-month DKJ auctions used for rate-setting.
  - Offering price is par on the first day of offering and par plus accrued interest afterwards.
  - BMAP denomination unit is 1 HUF.
  - BMAP uses a 360-day convention for accrued-interest and period coupon calculations.
  - The issuer does not redeem BMAP before maturity.
  - Primary-market acquisition is limited to natural persons.
  - Collateral-purpose transfer is out of scope and restricted by the official product rules.
  - This spec remains a product-type model and does not attempt to encode every live BMAP series edge case.
  - Live DKJ market data integration is future work; examples use explicit base-yield input values.

ui:
  formTitle: Bonus Hungarian Government Security
  sections:
    - id: bmap-core
      title: BMAP Inputs
      fieldNames:
        - principal
        - dkjBaseYieldPct
        - interestPremiumPct
        - startDate
        - purchaseDate
        - issueDate
        - firstCouponDate

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/lower-dkj-base-case.yaml
