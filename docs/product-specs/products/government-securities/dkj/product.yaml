specVersion: v2alpha1
kind: financial-product
id: government-security.dkj.standard
family: government-security
variant: dkj
productCode: dkj
displayName: Discount Treasury Bond (DKJ)
description: Short-term Hungarian treasury bill with no coupon, redeemed at face value at maturity.

category: treasury-bill
denominationCurrency: HUF
denominationUnit: 10000
issuanceModel: auction
yieldModel: discount-to-par
couponModel: none
referenceIndex: absent

inputs:
  - name: faceValue
    type: number
    label: Face Value
    required: true
    unit: currency
    description: Nominal value repaid at maturity.
    constraints:
      minimum: 10000

  - name: purchasePricePct
    type: number
    label: Purchase Price Percent
    required: true
    unit: percent
    description: Purchase price as percentage of face value.
    constraints:
      minimum: 0
      maximum: 200

  - name: termMonths
    type: integer
    label: Term Bucket in Months
    required: true
    unit: months
    description: Product-type maturity bucket for DKJ.
    constraints:
      enum: [3, 6, 12]

  - name: settlementDate
    type: string
    label: Settlement Date
    required: true
    unit: date
    description: Settlement date in ISO format.

  - name: maturityDate
    type: string
    label: Maturity Date
    required: true
    unit: date
    description: Maturity date in ISO format.

  - name: dayCountConvention
    type: string
    label: Day Count Convention
    required: false
    unit: text
    description: Day-count used for annualized yield (default ACT/360 denominator 360).
    constraints:
      enum: [ACT/360, ACT/365F, 30E/360]

outputs:
  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: true
    unit: currency
    description: Amount paid for the security at purchase.

  - name: redemptionValue
    type: number
    label: Redemption Value
    required: true
    unit: currency
    description: Face value repaid at maturity.

  - name: grossGain
    type: number
    label: Gross Gain
    required: true
    unit: currency
    description: Difference between redemption value and purchase amount.

  - name: simpleReturnPct
    type: number
    label: Simple Return
    required: false
    unit: percent
    description: Gross gain relative to purchase amount.

  - name: annualizedYieldPct
    type: number
    label: Annualized Yield
    required: true
    unit: percent
    description: Annualized yield using remaining days from settlement to maturity and the official discount-bill convention.

  - name: remainingDays
    type: integer
    label: Remaining Days
    required: false
    unit: days
    description: Derived days from settlement to maturity used for annualized yield.

assumptions:
  - DKJ is modeled as a non-coupon treasury bill.
  - The investor receives face value at maturity.
  - DKJ may be purchased below par, at par, or above par depending on issuance or market price.
  - DKJ maturity buckets are represented as 3, 6, and 12 months for this product type.
  - Denomination unit is 10,000 HUF; commercial composer face value defaults to that unit and accepts only multiples of it.
  - Issuance is modeled as auction-based.
  - Principal is repaid at maturity in one amount.
  - Remaining days are derived from settlementDate and maturityDate (not a primary stored input).
  - Annualized yield calculations use a 360-day convention consistent with the official DKJ formula unless dayCountConvention overrides the denominator.
  - The issuer does not redeem DKJ before maturity.
  - Secondary-market pricing and series-level auction data come from published market JSON when available.

ui:
  formTitle: Discount Treasury Bond (DKJ)
  sections:
    - id: dkj-core
      title: DKJ Inputs
      fieldNames:
        - faceValue
        - settlementDate
        - purchasePricePct
        - termMonths
        - maturityDate
        - dayCountConvention

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/shorter-maturity-case.yaml
