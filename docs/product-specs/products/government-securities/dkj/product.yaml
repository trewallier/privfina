specVersion: v2alpha2
kind: financial-product
id: government-security.dkj.standard
family: government-security
variant: dkj
productCode: dkj
displayName: Discount Treasury Bond (DKJ)
description: Short-term Hungarian treasury bill with no coupon, redeemed at face value at maturity.

category: treasury-bill
denominationCurrency: HUF
denominationUnit: 10000
issuanceModel: auction
yieldModel: discount-to-par
couponModel: none
referenceIndex: absent

inputs:
  - name: faceValue
    type: number
    label: Face Value
    required: true
    unit: currency
    description: Amount repaid at maturity in forints (HUF).
    constraints:
      minimum: 10000

  - name: purchasePricePct
    type: number
    label: Purchase Price Percent
    required: true
    unit: percent
    description: Price paid as a percent of face value (for example 99.5 means below par).
    constraints:
      minimum: 0
      maximum: 200

  - name: termMonths
    type: integer
    label: Term Bucket in Months
    required: true
    unit: months
    description: Official DKJ term bucket (3, 6, or 12 months). Does not invent a maturity date.
    constraints:
      enum: [3, 6, 12]

  - name: settlementDate
    type: string
    label: Settlement Date
    required: true
    unit: date
    description: Date the purchase settles (YYYY-MM-DD).

  - name: maturityDate
    type: string
    label: Maturity Date
    required: true
    unit: date
    description: Date face value is repaid (YYYY-MM-DD). Required — the calculator does not invent it from the term bucket.

  - name: dayCountConvention
    type: string
    label: Day Count Convention
    required: false
    unit: text
    description: Year length used when annualizing return. Defaults to actual days over a 360-day year (ACT/360).
    constraints:
      enum: [ACT/360, ACT/365F, 30E/360]

outputs:
  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: true
    unit: currency
    description: Cash paid at settlement.

  - name: redemptionValue
    type: number
    label: Redemption Value
    required: true
    unit: currency
    description: Face amount repaid at maturity.

  - name: grossGain
    type: number
    label: Gross Gain
    required: true
    unit: currency
    description: Redemption value minus purchase amount.

  - name: simpleReturnPct
    type: number
    label: Simple Return
    required: false
    unit: percent
    description: Gross gain as a percent of the purchase amount.

  - name: annualizedYieldPct
    type: number
    label: Annualized Yield
    required: true
    unit: percent
    description: Holding-period return scaled to a yearly rate using remaining days and the day-count year length.

  - name: remainingDays
    type: integer
    label: Remaining Days
    required: false
    unit: days
    description: Calendar days from settlement to maturity, used for the yearly yield.

assumptions:
  - DKJ is modeled as a non-coupon treasury bill.
  - The investor receives face value at maturity.
  - DKJ may be purchased below par, at par, or above par depending on issuance or market price.
  - DKJ maturity buckets are represented as 3, 6, and 12 months for this product type; maturityDate remains a required input.
  - Denomination unit is 10,000 HUF; commercial composer face value defaults to that unit and accepts only multiples of it.
  - Issuance is modeled as auction-based.
  - Principal is repaid at maturity in one amount.
  - Remaining days are derived from settlementDate and maturityDate (not a primary stored input).
  - Annualized yield uses finance_engine day-count helpers; dayCountConvention selects the year denominator (default 360).
  - The issuer does not redeem DKJ before maturity.
  - Secondary-market pricing and series-level auction data come from published market JSON when available.
  - Breaking input contract vs pre-ADR-0038 shapes is stamped as specVersion v2alpha2.

ui:
  formTitle: Discount Treasury Bond (DKJ)
  sections:
    - id: dkj-core
      title: DKJ Inputs
      fieldNames:
        - faceValue
        - settlementDate
        - purchasePricePct
        - termMonths
        - maturityDate
        - dayCountConvention

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/shorter-maturity-case.yaml
