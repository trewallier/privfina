specVersion: v2alpha3
productId: government-security.fixmap.standard
exampleId: stepped-coupon-case
title: Stepped FixMÁP coupon schedule example
description: Mid-holding FixMÁP purchase where published couponSchedule bands set period rates; accrued interest uses the covering band rate from the last quarterly payment (not the annual band From); cash coupons are quarterly (ga/4).

inputs:
  principal: 1000000
  annualCouponRatePct: 7.0
  purchaseDate: 2026-12-15
  issueDate: 2026-08-03
  maturityDate: 2031-08-03
  firstCouponDate: 2026-11-03
  dayCountConvention: ACT/360
  couponSchedule:
    - from: 2026-08-03
      to: 2027-08-03
      rate: 6.5
    - from: 2027-08-03
      to: 2028-08-03
      rate: 7.0
    - from: 2028-08-03
      to: 2029-08-03
      rate: 7.5
    - from: 2029-08-03
      to: 2030-08-03
      rate: 8.0
    - from: 2030-08-03
      to: 2031-08-03
      rate: 8.5

expected:
  annualCouponRatePct: 6.5
  accruedInterestAmount: 7583.333333333333
  purchaseAmount: 1007583.3333333334

notes:
  - "First accrual period runs issueDate → firstCouponDate; after a paid quarter, accrued restarts at the last payment (here 2026-11-03), not the annual rate-band From."
  - "Accrued from last payment 2026-11-03 through purchaseDate 2026-12-15 under the covering band (6.5% ACT/360): 1000000 * 0.065 * 42/360."
  - "Derived annualCouponRatePct is the covering-band rate at purchase (6.5), not the input fallback (7.0)."
  - "Cash coupons are quarterly (ga/4) and only on dates strictly after purchaseDate. Annual schedule Froms are rate bands, not the payment calendar — walk firstCouponDate by 3 months."
  - "Later bands demonstrate stepped fixed coupons without inventing rates for unpublished periods."
