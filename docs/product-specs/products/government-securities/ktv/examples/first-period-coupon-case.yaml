specVersion: v2alpha3
productId: government-security.ktv.standard
exampleId: first-period-coupon-case
title: MÁK 2037/A irregular first cash coupon
description: Issue-day purchase with couponSchedule locking the ajánlattétel first cash coupon (3.72% on 2026-09-23) then 6.25% annual bands through maturity.

inputs:
  principal: 1000000
  annualCouponRatePct: 6.25
  purchaseDate: 2026-02-18
  issueDate: 2026-02-18
  maturityDate: 2037-09-23
  firstCouponDate: 2026-09-23
  dayCountConvention: ACT/360
  couponSchedule:
    - from: 2026-02-18
      to: 2026-09-23
      rate: 3.72
    - from: 2026-09-23
      to: 2027-09-23
      rate: 6.25
    - from: 2027-09-23
      to: 2028-09-23
      rate: 6.25
    - from: 2028-09-23
      to: 2029-09-23
      rate: 6.25
    - from: 2029-09-23
      to: 2030-09-23
      rate: 6.25
    - from: 2030-09-23
      to: 2031-09-23
      rate: 6.25
    - from: 2031-09-23
      to: 2032-09-23
      rate: 6.25
    - from: 2032-09-23
      to: 2033-09-23
      rate: 6.25
    - from: 2033-09-23
      to: 2034-09-23
      rate: 6.25
    - from: 2034-09-23
      to: 2035-09-23
      rate: 6.25
    - from: 2035-09-23
      to: 2036-09-23
      rate: 6.25
    - from: 2036-09-23
      to: 2037-09-23
      rate: 6.25

expected:
  annualCouponRatePct: 3.72
  purchaseAmount: 1000000

notes:
  - Covering band at purchase is the irregular first period (3.72%), not the flat 6.25% fallback input.
  - First cash coupon on 2026-09-23 pays 3.72% of principal; later anniversary coupons pay 6.25%.
  - Purchase on issue day → accruedInterestAmount is 0.
