specVersion: v2alpha3
productId: government-security.ktv.standard
exampleId: mid-period-accrued-case
title: MÁK mid-period accrued interest
description: Purchase mid first coupon period; accrued uses ACT/365F on published ga (not the 3.72% payable stub).

inputs:
  principal: 1000000
  annualCouponRatePct: 6.25
  purchaseDate: 2026-06-18
  issueDate: 2026-02-18
  maturityDate: 2037-09-23
  firstCouponDate: 2026-09-23
  dayCountConvention: ACT/365F

expected:
  annualCouponRatePct: 6.25
  # ga × days / 365 = 0.0625 × 120 / 365
  accruedInterestAmount: 20547.945205479453
  purchaseAmount: 1020547.9452054794

notes:
  - Accrual numer = 120 days (2026-02-18 → 2026-06-18); denom = 365 (ACT/365F).
  - "Accrued: 1000000 * 0.0625 * 120/365 ≈ 20547.945205479453 (not 3.72% × 120/360)."
  - Auction accrued witness (2026-11-25 ≈ 1.0788%) matches 6.25% × 63/365, not /360.
