  annualCouponRatePct: 6.25
  purchaseDate: 2026-02-18
  issueDate: 2026-02-18
  maturityDate: 2037-09-23
  firstCouponDate: 2026-09-23
  dayCountConvention: ACT/360

expected:
  annualCouponRatePct: 6.25
  purchaseAmount: 1000000

notes:
  - Locked series 2037/A (ISIN HU0000407564); effective coupon 6.25% after the irregular first cash coupon.
