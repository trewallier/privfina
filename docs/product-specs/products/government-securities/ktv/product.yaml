specVersion: v2alpha3
kind: financial-product
id: government-security.ktv.standard
family: government-security
variant: ktv
productCode: ktv
displayName: Hungarian Government Bond (MÁK)
description: Hungarian government bond (Magyar Államkötvény / MÁK; machine id ktv). FIX annual cash coupons from published effective rates; Green series share this host. FLOAT cash-flow model is out of scope for this iteration.

category: retail-government-bond
denominationCurrency: HUF
denominationUnit: 1
issuanceModel: phased-public-offering
yieldModel: coupon-plus-redemption
couponModel: fixed-coupon
referenceIndex: absent
offeringPriceModel: par-plus-accrued-interest
earlyRedemptionByIssuer: false
investorEligibility: Primary-market acquisition is open to domestic and foreign natural and legal persons per the nyilvános ajánlattétel (soft composer hint only).
transferRestrictions: Collateral-purpose transfer modeling is out of scope.

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Face amount you invest in forints (HUF). Denomination unit is 1 HUF.
    constraints:
      minimum: 1

  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Published effective annual coupon rate (ga). Irregular first-period payable stub is derived as ga × days/365 (ACT/365F), not a FixMÁP covering-band rate. Do not invent FLOAT rates.
    constraints:
      minimum: 0
      maximum: 100

  - name: purchaseDate
    type: string
    label: Purchase Date
    required: true
    unit: date
    description: Date when the purchase is accounted for. Used to compute interest already earned.

  - name: issueDate
    type: string
    label: Issue Date
    required: true
    unit: date
    description: Date this series was issued (kibocsátás napja).

  - name: maturityDate
    type: string
    label: Maturity Date
    required: true
    unit: date
    description: Date the bond repays principal. Taken from the series when autofilled.

  - name: firstCouponDate
    type: string
    label: First Coupon Date
    required: false
    unit: date
    description: First interest payment date. Prefer offering paymentDates when autofilled (2037/A — 2026-09-23).

  - name: dayCountConvention
    type: string
    label: Day Count Convention
    required: false
    unit: text
    description: How days are counted for accrued interest and the first-period stub. Locked 2037/A witness uses ACT/365F (Actual/365). ADR 0044 ingest ACT/360 when offering dayCount is null is a quote fallback only — not product math for this series.
    constraints:
      enum: [ACT/360, ACT/365F, 30E/360]

  - name: couponSchedule
    type: array
    label: Coupon Schedule
    required: false
    unit: text
    description: Optional interest periods. Each row needs a start date; end date and rate may be empty for future unknown / FLOAT periods. Commercial autofill maps published coupons and offering paymentDates into this schedule. Never invent FLOAT coupon rates.
    constraints:
      items:
        type: object
        additionalProperties: false
        required: [from]
        properties:
          from:
            type: string
            format: date
            description: Period start date.
          to:
            type: ["string", "null"]
            format: date
            description: Period end date, or null when open-ended.
          rate:
            type: ["number", "null"]
            description: Annual coupon percent for the period, or null when not yet published / FLOAT.

outputs:
  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Yearly interest rate applied for the current period.

  - name: accruedInterestAmount
    type: number
    label: Accrued Interest
    required: false
    unit: currency
    description: Interest already earned from the previous coupon (or issue) through the purchase date. Accrues on published ga under the day-count convention (2037/A — ACT/365F), not on the payable first-period stub.

  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: false
    unit: currency
    description: Total paid at purchase — principal plus accrued interest when applicable.

assumptions:
  - MÁK is modeled as an annual-pay fixed-coupon government bond for FIX / Green series (Babakötvény-style first-period stub on ga; not a FixMÁP ACT/360 covering-band wrap).
  - Machine id stays ktv (ÁKK/allampapir label KTV); display name is Hungarian Government Bond (MÁK).
  - Commercial inputs use the published effective annual coupon rate (ga); do not invent FLOAT rates when listing or PDF omits them.
  - Coupon payment frequency is annual (product-type constant; not a calculated output).
  - Offering price is par on the first day of offering and par plus accrued interest afterwards.
  - MÁK denominationUnit is 1 HUF for commercial composer principal (parity with FixMÁP / Babakötvény); ÁKK 10 000 Ft alapcímlet is market packaging only and is not mirrored here.
  - issuanceModel stays phased-public-offering (sibling enum); ÁKK auction listing mode lives in offering ingest (ADR 0044), not a separate YAML issuanceModel.
  - Locked 2037/A product day-count is ACT/365F (Actual/365). ADR 0044 ingest ACT/360 when offering dayCount is null is quote/ingest fallback only.
  - Accrued interest uses ga under ACT/365F; the payable first-period stub is not the accrual rate.
  - Maturity comes from the series / input; calculators must not invent a fixed term length.
  - issueDate is the sole series/holding anchor when coupon schedule / firstCouponDate are absent.
  - "2037/A first cash stub: 6,25% * 217nap / 365nap = 3,72% (round to 0.01%); keep ga 6.25%."
  - When a couponSchedule is supplied (including from published market coupons / offering autofill), periods without a published rate (and schedule gaps) do not invent cash flows; without a schedule the path holds the flat yearly rate through maturity. First-period payable stub is still derived from ga × days/365 even when a schedule is absent.
  - Auction listings may leave saleWindow null — do not invent from auctionDate (DKJ precedent).
  - Principal is repaid at maturity in one amount (redemption equals principal).
  - The issuer does not redeem MÁK before maturity.
  - Green (Zöld) MÁK shares this product host under ktv.
  - FLOAT cash-flow model is out of scope for this iteration.
  - Breaking input contract aligns with ADR 0038 / v2alpha3 shapes used by sibling govsec hosts.

ui:
  formTitle: Hungarian Government Bond (MÁK)
  sections:
    - id: ktv-core
      title: MÁK Inputs
      fieldNames:
        - principal
        - purchaseDate
        - annualCouponRatePct
        - issueDate
        - maturityDate
        - firstCouponDate
        - dayCountConvention

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/first-period-coupon-case.yaml
  - ./examples/mid-period-accrued-case.yaml
