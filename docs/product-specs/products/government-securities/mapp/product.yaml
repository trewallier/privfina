specVersion: v2alpha3
kind: financial-product
id: government-security.mapp.standard
family: government-security
variant: mapp
productCode: mapp
displayName: Hungarian Government Security Plus (MÁP Plusz)
description: Hungarian retail government bond with a stepped fixed coupon schedule. Coupon frequency is series-authored (annual on newer offerings; semi-annual on older series).

category: retail-government-bond
denominationCurrency: HUF
denominationUnit: 1
issuanceModel: phased-public-offering
yieldModel: coupon-plus-redemption
couponModel: fixed-coupon
referenceIndex: absent
offeringPriceModel: par-plus-accrued-interest
earlyRedemptionByIssuer: false
investorEligibility: Primary-market acquisition is limited to natural persons.
transferRestrictions: Collateral-purpose transfer and early investor redemption are out of scope for this iteration and restricted by official MÁP Plusz product rules.

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Face amount you invest in forints (HUF).
    constraints:
      minimum: 1

  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Published yearly coupon rate (p.a.) for the current period; stepped bands live in couponSchedule when present. Each payment uses the Ismertető period rate gp derived from this annual rate and couponFrequencyMonths (regular gp = ga × frequencyMonths/12; irregular first period uses the published ACT/ACT add-on).
    constraints:
      minimum: 0
      maximum: 100

  - name: purchaseDate
    type: string
    label: Purchase Date
    required: true
    unit: date
    description: Date when the purchase is accounted for. Used to compute interest already earned.

  - name: issueDate
    type: string
    label: Issue Date
    required: true
    unit: date
    description: Date this series was issued.

  - name: maturityDate
    type: string
    label: Maturity Date
    required: true
    unit: date
    description: Date the bond repays principal. Taken from the series when autofilled.

  - name: firstCouponDate
    type: string
    label: First Coupon Date
    required: false
    unit: date
    description: First interest payment (kamatteljesítés) date. Prefer offering paymentDates when autofilled.

  - name: couponFrequencyMonths
    type: integer
    label: Coupon Frequency (Months)
    required: false
    unit: text
    description: Months between coupon payments for this series. Use 12 for newer annual-pay MÁP Plusz offerings and 6 for older semi-annual series. Defaults to 12 when omitted. Autofill may infer from offering paymentDates spacing.
    constraints:
      enum: [6, 12]

  - name: dayCountConvention
    type: string
    label: Day Count Convention
    required: false
    unit: text
    description: Accrued interest for MÁP Plusz follows the Ismertető ACT/ACT period-fraction formula (Tényleges/Tényleges). This field is retained for parity with sibling govsec hosts; MÁP Plusz calculators ignore ACT/360-style denominators for accrued.
    constraints:
      enum: [ACT/ACT, ACT/360, ACT/365F, 30E/360]

  - name: couponSchedule
    type: array
    label: Coupon Schedule
    required: false
    unit: text
    description: Optional published rate bands (often year bands on offerings). Each row needs a start date; end date and rate may be empty for future unknown periods. Bands select the covering annual rate ga only — they do not redefine payment dates or accrual starts. Commercial autofill maps published coupons into this schedule.
    constraints:
      items:
        type: object
        additionalProperties: false
        required: [from]
        properties:
          from:
            type: string
            format: date
            description: Period start date.
          to:
            type: ["string", "null"]
            format: date
            description: Period end date, or null when open-ended.
          rate:
            type: ["number", "null"]
            description: Annual coupon percent for the period, or null when not yet published.

outputs:
  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Yearly interest rate (ga) applied for the current period.

  - name: accruedInterestAmount
    type: number
    label: Accrued Interest
    required: false
    unit: currency
    description: Interest already earned through the purchase date per the Ismertető ACT/ACT period-fraction formula (irregular first period supported).

  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: false
    unit: currency
    description: Total paid at purchase — principal plus accrued interest when applicable.

assumptions:
  - MÁP Plusz is a stepped fixed-coupon retail bond. Coupon frequency is series-/offering-authored via couponFrequencyMonths (12 = newer annual-pay; 6 = older semi-annual) so both cadences share one product code.
  - Commercial inputs use the published effective annual coupon rate ga; do not revive series.prem or base+premium composition.
  - Regular period coupon rate gp = ga × couponFrequencyMonths / 12. Irregular first period uses the Ismertető formula gp = gBase + gBase × (dt1−d0)/(dt1−dt0) with gBase = ga × frequencyMonths/12 and technical dates stepped back one/two frequency periods from firstCouponDate (matches 2031/M6 first tényleges kamat 5,77% when frequencyMonths=12).
  - Accrued interest uses the Ismertető Tényleges/Tényleges period-fraction formulas (not ACT/360 day/360). Accrual anchors are payment dates from firstCouponDate + frequency steps (or issueDate before the first payment), not couponSchedule.from year-band starts.
  - Intermediate kamatteljesítés before maturity is kamatjuttatás — interest is paid in additional same-series MÁP Plusz face (no HUF coupon inflow). Only the final maturity kamatfizetés pays HUF cash coupon; principal redemption equals the compounded face after in-kind coupons.
  - Offering price is par on the first day of offering and par plus accrued interest afterwards.
  - MÁP Plusz denomination unit is 1 HUF; commercial composer principal defaults to that unit and accepts only multiples of it.
  - Maturity comes from the series / input; calculators must not invent a fixed term length.
  - issueDate is the sole series/holding anchor when coupon schedule / firstCouponDate are absent.
  - The first coupon period may be longer or shorter than one regular frequency period.
  - When a couponSchedule is supplied (including from published market coupons autofill), periods without a published rate (and schedule gaps) do not invent cash flows; without a schedule the path holds the flat yearly rate through maturity.
  - Early investor secondary sale windows (including Kamatjuttatást Követő Vételi Időszak at net 100%) and issuer early call are out of scope for this iteration.
  - Primary-market acquisition is limited to natural persons.
  - Collateral-purpose transfer is out of scope and restricted by the official product rules.
  - Nyomdai MÁP Plusz shares this family code (mapp); market routing already folds nyomdai variants into mapp.
  - Breaking input contract aligns with ADR 0038 / v2alpha3 shapes used by PMÁP, BMÁP, and FixMÁP, plus MÁP-specific couponFrequencyMonths.

ui:
  formTitle: Hungarian Government Security Plus (MÁP Plusz)
  sections:
    - id: mapp-core
      title: MÁP Plusz Inputs
      fieldNames:
        - principal
        - purchaseDate
        - annualCouponRatePct
        - issueDate
        - maturityDate
        - firstCouponDate
        - couponFrequencyMonths
        - dayCountConvention

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/stepped-coupon-case.yaml
  - ./examples/mid-period-after-coupon-case.yaml
  - ./examples/semi-annual-legacy-case.yaml
