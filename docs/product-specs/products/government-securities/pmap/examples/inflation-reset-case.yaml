specVersion: v2alpha1
productId: government-security.pmap.standard
exampleId: inflation-reset-case
title: Low effective-rate PMAP example
description: Scenario with a low published effective coupon (historically a floored inflation base plus premium).

inputs:
  principal: 1000000
  annualCouponRatePct: 0.5
  startDate: 2027-01-01
  purchaseDate: 2027-01-01
  issueDate: 2027-01-01
  maturityDate: 2037-01-01
  dayCountConvention: ACT/360

expected:
  annualCouponRatePct: 0.5
  purchaseAmount: 1000000

notes:
  - Commercial path uses the effective period rate; inflation-floor composition is not a required composer input.
