specVersion: v2alpha3
productId: government-security.pmap.standard
exampleId: nominal-case
title: Nominal PMAP example
description: Baseline PMAP scenario with published effective coupon rate and series maturity.

inputs:
  principal: 1000000
  annualCouponRatePct: 4.9
  purchaseDate: 2026-05-23
  issueDate: 2026-05-23
  maturityDate: 2036-05-23
  dayCountConvention: ACT/360

expected:
  annualCouponRatePct: 4.9
  purchaseAmount: 1000000

notes:
  - Effective coupon rate is supplied directly (historically equivalent to 4.4 inflation base + 0.5 premium).
  - Maturity is series-authored; calculators must not invent a fixed 10-year term.
