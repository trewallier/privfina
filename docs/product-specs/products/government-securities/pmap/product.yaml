specVersion: v1alpha1
kind: financial-product
id: government-security.pmap.standard
family: government-security
variant: pmap
displayName: Premium Hungarian Government Security
description: Hungarian retail government bond with inflation-linked variable coupon and annual interest payment.

category: retail-government-bond
denominationCurrency: HUF
denominationUnit: 1
issuanceModel: phased-public-offering
yieldModel: coupon-plus-redemption
couponModel: annual-variable
referenceIndex: prior-calendar-year-average-inflation
offeringPriceModel: par-plus-accrued-interest
earlyRedemptionByIssuer: false
investorEligibility: Primary-market acquisition is limited to natural persons.
transferRestrictions: Collateral-purpose transfer is out of scope and restricted by official PMAP product rules.

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Invested nominal amount.
    constraints:
      minimum: 1

  - name: interestPremiumPct
    type: number
    label: Interest Premium
    required: true
    unit: percent
    description: Fixed premium added on top of the inflation base.
    constraints:
      minimum: 0
      maximum: 100

  - name: previousYearAverageInflationPct
    type: number
    label: Previous Year Average Inflation
    required: true
    unit: percent
    description: Official annual average inflation for the previous calendar year.
    constraints:
      minimum: -100
      maximum: 100

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Investment start date in ISO format.

  - name: purchaseDate
    type: string
    label: Purchase Date
    required: false
    unit: date
    description: Purchase or valuation date in ISO format, used for accrued-interest-related calculations.

  - name: issueDate
    type: string
    label: Issue Date
    required: false
    unit: date
    description: Issue date of the PMAP series in ISO format.

  - name: firstCouponDate
    type: string
    label: First Coupon Date
    required: false
    unit: date
    description: First coupon payment date in ISO format if known.

outputs:
  - name: annualCouponRatePct
    type: number
    label: Annual Coupon Rate
    required: true
    unit: percent
    description: Coupon rate for the current annual interest period.

  - name: couponPaymentFrequency
    type: string
    label: Coupon Payment Frequency
    required: true
    unit: text
    description: Frequency of coupon payments.

  - name: effectiveInflationBasePct
    type: number
    label: Effective Inflation Base
    required: true
    unit: percent
    description: Inflation base after applying the 0% floor for zero or negative inflation.

  - name: periodCouponRatePct
    type: number
    label: Period Coupon Rate
    required: false
    unit: percent
    description: Coupon rate applicable to the current coupon period or first irregular period.

  - name: accruedInterestAmount
    type: number
    label: Accrued Interest
    required: false
    unit: currency
    description: Interest accrued from issue or previous coupon date to purchase/valuation date.

  - name: purchaseAmount
    type: number
    label: Purchase Amount
    required: false
    unit: currency
    description: Purchase amount based on principal plus accrued interest, where applicable.

  - name: redemptionValue
    type: number
    label: Redemption Value
    required: true
    unit: currency
    description: Principal repaid at maturity.

assumptions:
  - PMAP is modeled as an annual-pay inflation-linked retail bond.
  - Product-term intent in this pilot is 10 years.
  - Annual coupon rate is effective inflation base plus fixed premium.
  - Effective inflation base is max(previous-year-average-inflation, 0).
  - Offering price is par on the first day of offering and par plus accrued interest afterwards.
  - PMAP denomination unit is 1 HUF.
  - The first coupon period may differ from a regular annual period.
  - The issuer does not redeem PMAP before maturity.
  - Primary-market acquisition is limited to natural persons.
  - Collateral-purpose transfer is out of scope and restricted by the official product rules.
  - This spec remains a product-type model and does not attempt to encode every live series edge case.
  - Inflation data sourcing is future work; examples use explicit input values.

ui:
  formTitle: Premium Hungarian Government Security
  sections:
    - id: pmap-core
      title: PMAP Inputs
      fieldNames:
        - principal
        - interestPremiumPct
        - previousYearAverageInflationPct
        - startDate
        - purchaseDate
        - issueDate
        - firstCouponDate

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/inflation-reset-case.yaml
