specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: ebkm-promo-100000
title: EBKM lock — promo opening fee, 100 000 Ft/hó
description: >
  Published EBKM from OTP Lakástakarék értékesített termékek Hirdetmény A
  (effective 2026-10-10): continuous monthly deposit 100.000 Ft, account fee
  500 Ft/hó, számlanyitási díjkedvezmény (promo).

inputs:
  monthlyDeposit: 100000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-fixed-65000

expected:
  accountFeeMonthly: 500
  accountOpeningFee: 65000
  # Published Hirdetmény A goldens (authoritative commercially-usable target).
  ebkmPctWithPremium: 4.84
  ebkmPctWithoutPremium: -0.10
  # Schedule→Annex 3 regression pins (not published). Quarantine until with-premium matches.
  scheduleEbkmPctWithPremium: 4.92
  scheduleEbkmPctWithoutPremium: -0.1

notes:
  - Hirdetmény A EBKM pair with Premium / without Premium.
  - scheduleEbkmPct* are ADR 0031 quarantine pins of current schedule cash-flow EBKM (not Hirdetmény).
  - Without-premium schedule may coincide with published (−0.10); with-premium gap must stay visible.
  - Engine EBKM verification is ADR 0031; this example locks published goldens + schedule pins.
