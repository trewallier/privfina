specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: ebkm-promo-20000
title: EBKM lock — promo opening fee, 20 000 Ft/hó
description: >
  Published EBKM from OTP Lakástakarék értékesített termékek Hirdetmény A
  (effective 2026-10-10): continuous monthly deposit 20.000 Ft, account fee
  500 Ft/hó, számlanyitási díjkedvezmény (promo 0.5% path for deposits
  10.000–49.990 Ft).

inputs:
  monthlyDeposit: 20000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-half-percent

expected:
  accountFeeMonthly: 500
  # Published Hirdetmény A goldens (authoritative commercially-usable target).
  ebkmPctWithPremium: 4.35
  ebkmPctWithoutPremium: -0.58
  # Engine Annex 3 + ÁSZF 22. § kiutalás dating on OTP-maturity terminal amounts.
  # Both legs sit 0.01 past the two-decimal half-up boundary (residual gap).
  engineEbkmPctWithPremium: 4.36
  engineEbkmPctWithoutPremium: -0.57

notes:
  - Hirdetmény A EBKM pair with Premium / without Premium.
  - >
      ADR 0031 / ÁSZF 22. § packaging (terminal on first of lastDepositMonth+3 =
      2036-12-01) with OTP-aligned maturity terminal amounts solves to 4.36 / −0.57
      vs published 4.35 / −0.58. Raw rates ≈ 4.35547 / −0.57402 sit just past the
      6. § half-up boundary (published ticks need raw below 4.355 / at or below −0.575).
  - >
      End-of-kiutalási 2036-11-30 keeps the same promo-20k miss pair. No single
      day marker closes both legs (with-Premium needs ≥ 2036-12-02; without needs
      ≲ mid-November), and 2036-12-02 already reopens standard-100k with-Premium.
      Do not hunt a fitted settlement day without an ÁSZF/OTP cite.
  - Do not close these cells with a fitted lag/netting knob.
  - Percent opening fee needs szerződéses összeg from ÁSZF/calculator before engine fee amount assertion.
