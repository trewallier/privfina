specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: ebkm-promo-20000
title: EBKM lock — promo opening fee, 20 000 HUF/month
description: >
  Published unified deposit rate indicator (EBKM) from OTP Home Savings marketed
  products published tariff notice (Hirdetmény) A (effective 2026-10-10): continuous
  monthly deposit 20.000 Ft, account fee 500 HUF/month, discounted account-opening
  fee (promo 0.5% path for deposits 10.000–49.990 Ft).

inputs:
  monthlyDeposit: 20000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-half-percent

expected:
  accountFeeMonthly: 500
  # Published Hirdetmény A goldens (authoritative commercially-usable target).
  ebkmPctWithPremium: 4.35
  ebkmPctWithoutPremium: -0.58
  # Engine Annex 3 + ÁSZF EBKM packaging (allocation-period account fees +
  # interest to lastDepositMonth+3 day-1) matches published.
  engineEbkmPctWithPremium: 4.35
  engineEbkmPctWithoutPremium: -0.58

notes:
  - Hirdetmény A EBKM pair with Premium / without Premium.
  - >
      ADR 0031 ÁSZF packaging: account fees through allocation min (122 months /
      termMonths+2 per USZ Melléklet) and terminal interest through day before
      ÁSZF EBKM payout date (ÁSZF §10 / §22). Closes prior 0.01 half-up residual
      (day-1 retarget of OTP-maturity amounts alone was 4.36 / −0.57).
  - Percent opening fee needs contractual amount from ÁSZF/calculator before engine fee amount assertion.
