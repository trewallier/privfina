specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: ebkm-standard-100000
title: EBKM lock — standard 1% opening fee, 100 000 HUF/month
description: >
  Published unified deposit rate indicator (EBKM) from OTP Home Savings marketed
  products published tariff notice (Hirdetmény) B (effective 2026-10-10): continuous
  monthly deposit 100.000 Ft, account fee 500 HUF/month, 1% account-opening fee.

inputs:
  monthlyDeposit: 100000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: standard-1pct

expected:
  accountFeeMonthly: 500
  # Published Hirdetmény B goldens (authoritative commercially-usable target).
  ebkmPctWithPremium: 4.48
  ebkmPctWithoutPremium: -0.40
  # Engine Annex 3 + ÁSZF EBKM packaging (allocation-period fees + interest to payout date).
  engineEbkmPctWithPremium: 4.48
  engineEbkmPctWithoutPremium: -0.40

notes:
  - Hirdetmény B EBKM pair with Premium / without Premium.
  - 1% opening fee is percent of contractual amount (26 000 000 → 260 000 Ft).
  - "ADR 0031: ÁSZF EBKM packaging (termMonths+2 account fees; interest to lastDepositMonth+3 day-1) matches both goldens."
