specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: maturity-premium-120
title: Maturity Premium tier — 120 months housing purpose
description: >
  Continuous saving through month 120 with housing-purpose allotment/termination
  credits OTP Lakástakarék Prémium at 30%. Terminal / interest goldens follow the
  OTP product-page calculator (authoritative); engine ACT/360 interest to last
  deposit remains quarantined until ÁSZF payout dating reconciles.

inputs:
  monthlyDeposit: 50000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-fixed-65000

expected:
  accountFeeMonthly: 500
  accountOpeningFee: 65000
  totalDeposits: 6000000
  totalAccountFees: 60000
  premiumRatePct: 30
  premiumBase: 6000000
  premiumAmount: 1800000
  # OTP authoritative — same capture as web-calculator-maturity-50000.yaml
  depositInterest: 31152
  terminalPayout: 7831152
  contractAmount: 13000000
  engineDepositInterest: 30286
  engineTerminalPayout: 7830286
  engineTerminalPayoutDeltaFt: -866
  earlyExitPremiumRatePctByMonthBand:
    months49to96: 10
    months97to120: 20
  maturityPremiumRatePctFromMonth120: 30

notes:
  - Premium percents from Hirdetmény B / USZ §10 (natural person and társasház tables).
  - premiumBase = contractual deposits only; Premium has no compound interest (USZ §10).
  - >
    depositInterest / terminalPayout are OTP product-page calculator figures
    (7 831 152 Ft marketing band / widget). See web-calculator-maturity-50000.yaml
    source block.
  - contractAmount 13 000 000 Ft = monthly 50 000 via 3.846‰ (ceil10).
  - Loyalty unlock is out of scope for this default continuous path.
  - >
    Engine gap (−866 Ft) is deposit interest only: accrual currently stops at last
    deposit; OTP implies ~two further months toward first-of-month payout. Blocks
    calc-aligned until ÁSZF-sourced.
