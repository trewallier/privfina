  webpageTerminalPayout: 3132464
  webpageTerminalPayoutDeltaFt: -351

notes:
  - "Source: otp-product-page-calculator (see source.url / source.capturedAt)."
  - "Webpage UI labels monthly payable as deposit + 500 Ft account fee (20 500 Ft)."
  - "accountOpeningFee is the green akciós díj; accountOpeningFeeStandard1pct is the crossed-out 1% line."
  - "Engine terminalPayout uses ACT/360 + yearly capitalization to last deposit; webpageTerminalPayout is the calculator 'Lejáratkor felvehető megtakarítás'."
  - "webpageTerminalPayoutDeltaFt = engine terminalPayout − webpageTerminalPayout (residual; do not force-fit)."
