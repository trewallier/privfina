specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: web-calculator-maturity-20000
title: Web calculator maturity — 20 000 Ft/hó promo opening fee
description: >
  OTP product-page calculator output for contractual monthly deposit 20 000 Ft
  (UI shows 20 500 Ft havonta fizetendő = deposit + 500 Ft account fee), 10-year
  path with promo opening fee. OTP published numbers are authoritative.

source:
  kind: otp-product-page-calculator
  url: https://www.otpbank.hu/lakastakarek/lakastakarek-premium-ajanlat
  capturedAt: "2026-10-25"
  note: >
    Interactive "Havi betét összege" widget on Lakástakarék Prémium Plusz online
    ajánlat page. Captured Europe/Budapest. EBKM is not computed by this widget
    (static Hirdetmény footnotes only).

inputs:
  monthlyDeposit: 20000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-half-percent

expected:
  accountFeeMonthly: 500
  accountOpeningFee: 26000
  accountOpeningFeeStandard1pct: 52000
  contractAmount: 5200000
  totalDeposits: 2400000
  totalAccountFees: 60000
  premiumRatePct: 30
  premiumBase: 2400000
  premiumAmount: 720000
  # OTP authoritative (Lejáratkor felvehető megtakarítás)
  depositInterest: 12464
  terminalPayout: 3132464
  # Engine (interest stops at last deposit) — quarantine until ÁSZF payout horizon reconciles
  engineDepositInterest: 12113
  engineTerminalPayout: 3132113
  engineTerminalPayoutDeltaFt: -351

notes:
  - "Source: otp-product-page-calculator (see source.url / source.capturedAt). OTP figures are authoritative."
  - "Webpage UI labels monthly payable as deposit + 500 Ft account fee (20 500 Ft)."
  - "accountOpeningFee is the green akciós díj; accountOpeningFeeStandard1pct is the crossed-out 1% line."
  - >
    Gap: engineDepositInterest / engineTerminalPayout use ACT/360 + yearly capitalization
    with accrual stopping at the last deposit date. OTP terminal implies ~311 more Ft of
    interest. Extending accrual to the first of the month two months after last deposit
    (2036-11-01 for start 2026-10-10) recovers almost all of the gap (engine then −3 Ft).
    Do not fit a lag knob without ÁSZF-sourced payout dating — calc-aligned stays blocked.
