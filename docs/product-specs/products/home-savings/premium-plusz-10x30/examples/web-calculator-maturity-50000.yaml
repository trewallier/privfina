specVersion: v2alpha1
productId: home-savings.premium-plusz-10x30.standard
exampleId: web-calculator-maturity-50000
title: Web calculator maturity — 50 000 HUF/month promo fixed opening fee
description: >
  OTP product-page calculator output for contractual monthly deposit 50 000 Ft
  (UI shows 50 500 Ft monthly payable = deposit + 500 Ft account fee), 10-year
  path with promo fixed 65 000 Ft opening fee. Same page also shows the static
  marketing band "7 831 152 Ft" for 10 years / 30% at 50 000 HUF/month. OTP
  at-maturity (Lejáratkor) terminal is authoritative.

source:
  kind: otp-product-page-calculator
  url: https://www.otpbank.hu/lakastakarek/lakastakarek-premium-ajanlat
  capturedAt: "2026-10-25"
  note: >
    Interactive monthly deposit amount ("Havi betét összege") widget on the
    Lakástakarék Prémium Plusz online offer page. Captured Europe/Budapest.
    Matches the page's static 50 000 Ft illustration terminal (7 831 152 Ft).
    depositInterest is derived from that terminal.

inputs:
  monthlyDeposit: 50000
  termMonths: 120
  startDate: 2026-10-10
  housingPurpose: true
  openingFeeMode: promo-fixed-65000

expected:
  accountFeeMonthly: 500
  accountOpeningFee: 65000
  accountOpeningFeeStandard1pct: 130000
  contractAmount: 13000000
  totalDeposits: 6000000
  totalAccountFees: 60000
  premiumRatePct: 30
  premiumBase: 6000000
  premiumAmount: 1800000
  terminalPayout: 7831152
  depositInterest: 31152
  maturityPayoutDate: 2036-11-01
  engineDepositInterest: 31156
  engineTerminalPayout: 7831156
  engineTerminalPayoutDeltaFt: 4

notes:
  - "Source: otp-product-page-calculator (see source.url / source.capturedAt). OTP at-maturity (Lejáratkor) terminal is authoritative."
  - "depositInterest is derived as terminalPayout − totalDeposits − premiumAmount."
  - "Webpage UI labels monthly payable as deposit + 500 Ft account fee (50 500 Ft)."
  - "accountOpeningFee is the green promotional fee (akciós díj, 65 000); accountOpeningFeeStandard1pct is 1% of contract."
  - >
    maturityPayoutDate is OTP-calculator continuous-path packaging (first of month
    two months after last deposit), not literal ÁSZF §22 (1). Engine residual +4 Ft
    is unexplained (mixed-sign across captures; not proven rounding).
