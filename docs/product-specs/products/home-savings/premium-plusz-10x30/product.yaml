specVersion: v2alpha1
kind: financial-product
id: home-savings.premium-plusz-10x30.standard
family: home-savings
variant: premium-plusz-10x30
productCode: premium-plusz-10x30
displayName: OTP Home Savings Premium Plus 10x30 (Lakástakarék PRÉMIUM PLUSZ 10x30)
description: >
  OTP Lakástakarék Zrt. home-savings (lakás-előtakarékossági) contract,
  PRÉMIUM PLUSZ 10x30 product scheme (módozat). Customer-perspective savings
  schedule only (deposits, account fees, opening fee, OTP Home Savings Premium).
  No state support for contracts from 2018-10-17. LTP home loan (lakáskölcsön) /
  bridging loan (áthidaló kölcsön) is out of scope for this product folder
  (ROADMAP §5e deferred).

engine:
  instrumentType: home-savings
  paymentFrequency: monthly
  # Deposit interest rate sheet annex (USZ Melléklet) 2026-08-03 — PRÉMIUM PLUSZ 10x30
  depositInterestAnnualRatePct: 0.1
  savingsRatePermille: 3.846
  minContractAmount: 2600000
  maxContractAmount: 26000000
  evaluationMinMonths: 120
  allocationMinMonths: 122

# Marketed from 2026-08-03 (Hirdetmény); still sold — to is null.
saleWindow:
  from: "2026-08-03"
  to: null

premiumTiers:
  bands:
    - { minHoldingMonths: 120, ratePct: 30 }
    - { minHoldingMonths: 97, ratePct: 20 }
    - { minHoldingMonths: 49, ratePct: 10 }
  months49to96: 10
  months97to120: 20
  maturityFrom120: 30

eligibilityRules:
  - natural-person-or-condominium-cooperative-saver
  - hungarian-residential-or-stay-address-for-natural-person
  - housing-purpose-required-for-premium
  - no-state-support-post-2018-10-17
  - loyalty-commitment-required-for-promo-opening-fee

pricing:
  rateSettingRule: usz-melleklet-0.1pct-act360-plus-otp-premium-tiers
  notes:
    - >
      Sources: published tariff notice (Hirdetmény) for marketed products
      (effective 2026-10-10); fee schedule for interest/fees/costs (Díjtáblázat,
      effective 2026-08-03); General Terms and Conditions (ÁSZF) publication
      2026-03-24; Business Regulations annex (Üzletszabályzat Melléklet)
      effective 2026-08-03. Europe/Budapest dates.
    - >
      Product-scheme lock-ins (deposit interest rate sheet annex / USZ Melléklet):
      deposit interest 0.10% p.a.; savings rate 3.846‰/month; contractual amount
      2 600 000–26 000 000 Ft; monthly deposit =
      ceil10(contractual amount × 3.846 / 1000).
    - >
      Interest: ACT/360 daily (principal × rate × days / (360 × 100)); yearly
      capitalization; accrues from credit day through day before payout (ÁSZF §10).
      Continuous-path maturity payout date packaging = first calendar day of the
      month two months after last deposit — OTP product-page calculator alignment
      (not literal ÁSZF §22 (1) payout month / not startDate+122 calendar months).
      ÁSZF §22 still supplies the 2-month allocation (kiutalás) structure
      (USZ Melléklet allocation min 122). Residuals vs OTP at-maturity (Lejáratkor)
      ≤4 Ft, mixed-sign, unexplained.
    - >
      OTP Home Savings Premium (not state aid): % of contractual deposits only
      (no compound on Premium); 30% after month 120 with housing-purpose use;
      early exit 10% (49–96) / 20% (97–120) (USZ §10 / Hirdetmény).
    - >
      Loyalty (Hűség) period for promo opening-fee contracts: from savings start
      through the last day of month 48. Loyalty unlock fee (current cohort from
      2026-08-03): 100% of waived opening fee through month 48.

discounts:
  - name: promo-opening-fee-half-percent
    type: fee-waiver
    value: 50
    unit: percent
    conditions:
      - monthly-deposit-10000-to-49990
      - loyalty-commitment-48-months
      - promo-hirdetmeny-active
    appliesToFeeNames:
      - szamlanyitasi-dij
  - name: promo-opening-fee-fixed-65000
    type: fee-waiver
    value: 0
    unit: amount
    conditions:
      - monthly-deposit-50000-to-100000
      - loyalty-commitment-48-months
      - promo-hirdetmeny-active
      - opening-fee-fixed-65000-ft
    appliesToFeeNames:
      - szamlanyitasi-dij

fees:
  - name: szamlanyitasi-dij
    type: account-opening
    value: 1
    unit: percent
    timing: upfront
    description: >
      Standard account opening fee is 1% of contractual amount. Promo tables
      (Hirdetmény A): 0.5% of contract amount when monthly deposit is
      10.000–49.990 Ft; fixed 65.000 Ft when monthly deposit is 50.000–100.000 Ft,
      both requiring 48-month loyalty commitment.
  - name: szamlavezetesi-dij
    type: account-management
    value: 500
    unit: amount
    timing: periodic
    description: Monthly account management fee for contracts from 2026-08-03 (500 HUF/month).
  - name: huseg-feloldas-dij
    type: other
    value: 100
    unit: percent
    timing: on-event
    description: >
      Loyalty unlock fee for contracts from 2026-08-03: 100% of the waived
      opening fee through the last day of savings month 48 (scenario mode only).

inputs:
  - name: monthlyDeposit
    type: number
    label: Monthly Deposit
    required: true
    unit: currency
    description: Contractual monthly deposit (10.000–100.000 Ft).
    constraints:
      minimum: 10000
      maximum: 100000
  - name: termMonths
    type: integer
    label: Savings Term (Months)
    required: true
    unit: months
    description: Savings period; product scheme full Premium path uses 120 months.
    constraints:
      minimum: 1
      maximum: 120
  - name: startDate
    type: string
    label: Savings Start Date
    required: true
    unit: date
    description: First savings month start (ISO date).
  - name: housingPurpose
    type: boolean
    label: Housing Purpose Assumed
    required: true
    description: When true, Premium tiers apply at exit/allocation (hint for v1; not hard validation).
  - name: openingFeeMode
    type: string
    label: Opening Fee Mode
    required: true
    description: standard-1pct | promo-half-percent | promo-fixed-65000
    constraints:
      enum:
        - standard-1pct
        - promo-half-percent
        - promo-fixed-65000
  - name: contractAmount
    type: number
    label: Contract Amount
    required: false
    unit: currency
    description: >
      Contractual amount when known from the offering calculator / ÁSZF.
      Required to evaluate percent-based opening fees once sourced; optional
      until contract-amount formula is locked.

derivedVariables:
  - name: accountOpeningFee
    type: number
    label: Account Opening Fee
    required: true
    unit: currency
    description: Resolved opening fee from mode + monthly deposit + contract amount.
  - name: premiumRatePct
    type: number
    label: Premium Rate Percent
    required: true
    unit: percent
    description: OTP Premium percent from term and housing-purpose path.

outputs:
  - name: totalDeposits
    type: number
    label: Total Deposits
    required: true
    unit: currency
    description: Sum of monthly deposits over the modeled term.
  - name: totalAccountFees
    type: number
    label: Total Account Fees
    required: true
    unit: currency
    description: Sum of monthly account management fees.
  - name: premiumAmount
    type: number
    label: Premium Amount
    required: true
    unit: currency
    description: OTP Home Savings Premium credited under the assumed exit path.
  - name: terminalPayout
    type: number
    label: Terminal Payout
    required: true
    unit: currency
    description: Customer inflow at allocation/termination (deposits + interest if modeled + Premium).
  - name: ebkmPct
    type: number
    label: EBKM Percent
    required: true
    unit: percent
    description: >
      Engine unified deposit rate indicator (EBKM) for verification against
      published tariff notice (Hirdetmény) (ADR 0031).

assumptions:
  - Customer-perspective cash flows only; no bank internal legs.
  - Default path is continuous monthly saving with housing-purpose Premium at exit.
  - State support is absent for this offering cohort.
  - Deposit interest uses engine.depositInterestAnnualRatePct (0.10) with ACT/360 + yearly capitalization through the OTP-aligned continuous-path maturity payout date (ÁSZF §10 accrual; §22 supplies the 2-month allocation structure only).
  - Contract amount derives from monthly deposit via engine.savingsRatePermille (3.846) when not supplied.
  - Irregular-payment Premium quarterly caps (USZ §10 (4)) are out of scope for the continuous contractual path.

ui:
  formTitle: OTP Home Savings Premium Plus 10x30 (Lakástakarék PRÉMIUM PLUSZ 10x30)
  sections:
    - id: contract
      title: Contract
      fieldNames:
        - monthlyDeposit
        - termMonths
        - startDate
        - housingPurpose
        - openingFeeMode
        - contractAmount
    - id: results
      title: Results
      fieldNames:
        - totalDeposits
        - totalAccountFees
        - premiumAmount
        - terminalPayout
        - ebkmPct

exampleRefs:
  - examples/ebkm-promo-100000.yaml
  - examples/ebkm-promo-20000.yaml
  - examples/ebkm-standard-100000.yaml
  - examples/ebkm-standard-20000.yaml
  - examples/maturity-premium-120.yaml
  - examples/web-calculator-maturity-20000.yaml
  - examples/web-calculator-maturity-50000.yaml
  - examples/web-calculator-maturity-100000.yaml
