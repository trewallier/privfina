specVersion: v2alpha1
kind: financial-product
id: mortgage-loan.csok-plusz.standard
family: mortgage-loan
variant: csok-plusz
productCode: csok-plusz
displayName: OTP Year-Saver CSOK Plus Home Loan (Évnyerő CSOK Plusz Lakáshitel)
description: >
  State-subsidized CSOK Plus home loan from OTP Jelzálogbank with a mandatory
  12-month interest-only grace period, customer rate fixed at 3% during subsidy,
  and 1y → 1y → 5y interest-period structure. Conditions sourced from the OTP
  published tariff notice (Hirdetmény) effective for applications accepted from
  2026-04-20 (Lakáshitel H kondíció 2026-04-20), section 2.2.1.2.

engine:
  instrumentType: loan
  rateType: state-subsidized
  amortizationType: interest-only-then-annuity
  paymentFrequency: monthly
  interestDayCountConvention: "act/360"
  paymentRounding: forint
  gracePeriodMonths: 12
  interestPeriodMonths: 12

subsidy:
  type: state-interest-subsidy
  customerRate: 0.03
  subsidyDurationMonths: 300

loanPurposes:
  - used-home-purchase
  - new-home-purchase
  - extension

pricing:
  rateSettingRule: state-subsidized-customer-rate-fixed-with-akk-linked-transactional-cap
  notes:
    - "Customer-payable interest rate 3,00% during the interest-subsidy period (max 25 years, plus any first-child repayment pause)."
    - "Contractual interest rate (ügyleti kamat) from 1 April 2026 is 7,87% (ÁKK-linked cap); from 1 May 2026 is 7,90%."
    - "Interest periods: first two periods are 1 year each, then 5-year periods through the end of the term."
    - "CSOK Plus is only available with a 12-month grace period (interest-only then annuity)."
    - "THM representative example for new/used home purchase without fee discount is 3,3% (12 HUF million / 20 years)."

discounts:
  - name: otp-dijkedvezmenyes-folyositasi-dij-csokkentes
    type: fee-waiver
    value: 91.67
    unit: percent
    conditions:
      - groupama-insurance-conditions-met
      - customer-pays-8-33-percent-of-disbursement-fee-capped-at-25000-ft

fees:
  - name: folyositasi-dij
    type: disbursement
    value: 0.75
    unit: percent
    maxAmount: 300000
    timing: upfront
    description: >
      CSOK Plus disbursement fee 0,75%, max 300.000 Ft. Under OTP discounted-fee campaign
      with insurance conditions, only 8,33% of the fee (max 25.000 Ft of that share) remains payable.
  - name: hitelbiztositeki-ertek-megallapitas
    type: appraisal
    value: 58765
    unit: amount
    timing: upfront
    description: On-site appraisal for demand under 50 HUF million (base).
  - name: fedezetkezelesi-koltseg
    type: property-management
    value: 20000
    unit: amount
    timing: upfront
    description: 20.000 Ft per collateral.
  - name: tulajdoni-lap-lekeres
    type: land-registry
    value: 9600
    unit: amount
    timing: upfront
    description: >
      Certified electronic title-deed extract (4.800 Ft/property × 2 requests — underwriting + disbursement)
      for one collateral in the §6 representative packaging.
  - name: terkepmasolat-lekeres
    type: land-registry
    value: 5000
    unit: amount
    timing: upfront
    description: >
      Cadastral-map extract fee (5.000 Ft/property) assumed for one detached-house
      collateral in the §6 representative packaging.
  - name: fedezetvaltozasi-koltseg
    type: land-registry
    value: 10600
    unit: amount
    timing: upfront
    description: >
      Collateral change fee (10.600 Ft/collateral/mortgage) for mortgage release;
      included in Hirdetmény §6 total credit-cost fees / THM packaging.
  - name: elotorlesztesi-dij
    type: prepayment
    value: 1
    unit: percent
    timing: on-event
    description: 1,00% for CSOK Plus.
  - name: szerzodesmodositasi-dij
    type: contract-modification
    value: 51850
    unit: amount
    timing: on-event
    description: Flat contract modification fee (e.g. prolongation).

eligibilityRules:
  - Eligible under 518/2023. (XI. 30.) Korm. rendelet CSOK Plus program rules.
  - Mortgage collateral on residential real estate is required.
  - Property insurance meeting lender conditions is required.
  - State interest subsidy applies only to non-overdue principal; overdue principal accrues the full contractual interest rate.
  - Mandatory 12-month interest-only grace at the start of the term.

inputs:
  - name: principal
    type: number
    label: Loan Principal
    required: true
    unit: currency
    description: Approved forint principal under the CSOK Plus program.
    constraints:
      minimum: 1

  - name: annualInterestRatePct
    type: number
    label: Customer Annual Interest Rate
    required: true
    unit: percent
    description: Customer-payable interest rate during the subsidy period (fixed 3,00%).
    constraints:
      minimum: 0
      maximum: 100
      enum: [3]

  - name: transactionalAnnualRatePct
    type: number
    label: Transactional Annual Interest Rate
    required: false
    unit: percent
    description: Contractual interest rate (ÁKK-linked cap). April 2026 packaging uses 7,87%.
    constraints:
      minimum: 0
      maximum: 100
      enum: [7.87, 7.9]

  - name: termMonths
    type: integer
    label: Term in Months
    required: true
    unit: months
    description: Full contractual term in months (includes the mandatory 12-month grace).
    constraints:
      minimum: 13
      maximum: 480

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Loan start date in ISO format.

  - name: gracePeriodMonths
    type: integer
    label: Grace Period (Months)
    required: true
    unit: months
    description: Mandatory interest-only months before annuity amortization begins.
    constraints:
      enum: [12]

  - name: loanPurpose
    type: string
    label: Loan Purpose
    required: true
    description: Purpose code affecting fees and THM presentation.
    constraints:
      enum:
        - used-home-purchase
        - new-home-purchase
        - extension

derivedVariables:
  - name: monthlyInterestRate
    type: number
    label: Monthly Customer Interest Rate
    required: false
    unit: rate
    description: Customer annual rate divided by 12 and converted from percent to decimal.

outputs:
  - name: graceInterestOnlyPayment
    type: number
    label: Grace Monthly Payment
    required: true
    unit: currency
    description: Interest-only installment during the mandatory 12-month grace.

  - name: monthlyPayment
    type: number
    label: Amortizing Monthly Installment
    required: true
    unit: currency
    description: Level annuity installment from month 13 onward.

  - name: paymentCount
    type: integer
    label: Payment Count
    required: true
    unit: count
    description: Number of scheduled monthly repayments across grace and amortization.

  - name: totalPaid
    type: number
    label: Total Paid
    required: true
    unit: currency
    description: Hirdetmény total including packaged fees when taken from the representative example.

  - name: thmPct
    type: number
    label: THM
    required: false
    unit: percent
    description: Published total cost of credit indicator for the representative case.

assumptions:
  - "Customer rate is fixed at 3,00% during state interest subsidy (up to 25 years, extendable by first-child repayment pause)."
  - "First 12 months are interest-only; amortization begins in month 13 over the remaining term."
  - "Representative Hirdetmény example uses new/used home purchase, 12.000.000 Ft, 20 years, conditions as of 2026-04-01 packaging with 2026-04-20 Hirdetmény product rates."
  - "Engine schedule uses ACT/360 equal-month interest: interest = principal × r × (365/12) / 360, with paymentRounding forint (ADR 0025) so check-1 installments match §6 at the stated rate."
  - "Representative fee package includes disbursement + appraisal + collateral administration + title-deed extract (2×) + cadastral-map extract + collateral change so engine totalCreditCostFees matches published §6 (closes check 3)."
  - "Market products (otp-1x1, otp-zold, vegig-fix) and other subsidized codes are separate productCodes."

ui:
  formTitle: OTP Year-Saver CSOK Plus Home Loan (Évnyerő CSOK Plusz Lakáshitel)
  sections:
    - id: csok-plusz-core
      title: Loan Inputs
      fieldNames:
        - principal
        - annualInterestRatePct
        - transactionalAnnualRatePct
        - termMonths
        - startDate
        - gracePeriodMonths
        - loanPurpose

exampleRefs:
  - ./examples/hirdetmeny-representative-home-purchase.yaml
