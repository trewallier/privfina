specVersion: v2alpha1
kind: financial-product
id: mortgage-loan.falusi-csok.standard
family: mortgage-loan
variant: falusi-csok
productCode: falusi-csok
displayName: OTP Home-Creation Loan — Village CSOK (Falusi CSOK / Otthonteremtési Lakáshitel)
description: >
  State-subsidized Village CSOK / home-creation loan for preferred small
  settlements, with customer rate fixed at 3% during subsidy and 1y → 1y → 5y
  interest periods. Conditions sourced from the OTP published tariff notice
  (Hirdetmény) effective for applications accepted from 2026-04-20
  (Lakáshitel H kondíció 2026-04-20), section 2.2.1.1.

engine:
  instrumentType: loan
  rateType: state-subsidized
  amortizationType: level-payment
  paymentFrequency: monthly
  interestDayCountConvention: "act/360"
  paymentRounding: forint
  gracePeriodMonths: 0
  interestPeriodMonths: 12

subsidy:
  type: state-interest-subsidy
  customerRate: 0.03
  subsidyDurationMonths: 300

loanPurposes:
  - used-home-purchase
  - renovation
  - modernization
  - extension

pricing:
  rateSettingRule: state-subsidized-customer-rate-fixed-with-akk-linked-transactional-cap
  notes:
    - "Customer-payable interest rate 3,00% during the interest-subsidy period (max 25 years)."
    - "Contractual interest rate (ügyleti kamat) from 1 April 2026 is 8,18%; from 1 May 2026 is 8,22% (ÁKK 115% + 1 pp cap)."
    - "Interest periods: first two periods are 1 year each, then 5-year periods."
    - "THM representative example for used-home purchase is 3,3% (12 HUF million / 20 years, multi-child / preferred small settlement)."

fees:
  - name: folyositasi-dij
    type: disbursement
    value: 1
    unit: percent
    maxAmount: 200000
    timing: upfront
    description: Village CSOK disbursement fee 1,00%, max 200.000 Ft.
  - name: hitelbiztositeki-ertek-megallapitas
    type: appraisal
    value: 58765
    unit: amount
    timing: upfront
    description: On-site appraisal for demand under 50 HUF million (base).
  - name: fedezetkezelesi-koltseg
    type: property-management
    value: 20000
    unit: amount
    timing: upfront
    description: 20.000 Ft per collateral.
  - name: tulajdoni-lap-lekeres
    type: land-registry
    value: 9600
    unit: amount
    timing: upfront
    description: >
      Certified electronic title-deed extract (4.800 Ft/property × 2 requests — underwriting + disbursement)
      for one collateral in the §6 representative packaging.
  - name: terkepmasolat-lekeres
    type: land-registry
    value: 5000
    unit: amount
    timing: upfront
    description: >
      Cadastral-map extract fee (5.000 Ft/property) assumed for one detached-house
      collateral in the §6 representative packaging.
  - name: fedezetvaltozasi-koltseg
    type: land-registry
    value: 10600
    unit: amount
    timing: upfront
    description: >
      Collateral change fee (10.600 Ft/collateral/mortgage) for mortgage release;
      included in Hirdetmény §6 total credit-cost fees / THM packaging.
  - name: elotorlesztesi-dij
    type: prepayment
    value: 1.5
    unit: percent
    timing: on-event
    description: Standard prepayment fee band for Village CSOK packaging.
  - name: szerzodesmodositasi-dij
    type: contract-modification
    value: 51850
    unit: amount
    timing: on-event
    description: Flat contract modification fee.

discounts: []

eligibilityRules:
  - Eligible under 302/2023. (VII. 11.) Korm. rendelet for preferred small settlements (Village CSOK / home creation).
  - Mortgage collateral on residential real estate is required.
  - Property insurance meeting lender conditions is required.
  - State interest subsidy applies only to non-overdue principal.

inputs:
  - name: principal
    type: number
    label: Loan Principal
    required: true
    unit: currency
    description: Approved forint principal under Village CSOK / home creation.
    constraints:
      minimum: 1

  - name: annualInterestRatePct
    type: number
    label: Customer Annual Interest Rate
    required: true
    unit: percent
    description: Customer-payable interest rate during subsidy (fixed 3,00%).
    constraints:
      minimum: 0
      maximum: 100
      enum: [3]

  - name: transactionalAnnualRatePct
    type: number
    label: Contractual Annual Interest Rate
    required: false
    unit: percent
    description: Contractual interest rate (ÁKK-linked cap). April 2026 packaging uses 8,18%.
    constraints:
      minimum: 0
      maximum: 100
      enum: [8.18, 8.22]

  - name: termMonths
    type: integer
    label: Term in Months
    required: true
    unit: months
    description: Full contractual term in months.
    constraints:
      minimum: 12
      maximum: 480

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Loan start date in ISO format.

  - name: loanPurpose
    type: string
    label: Loan Purpose
    required: true
    description: Purpose code affecting fees and THM presentation.
    constraints:
      enum:
        - used-home-purchase
        - renovation
        - modernization
        - extension

derivedVariables:
  - name: monthlyInterestRate
    type: number
    label: Monthly Customer Interest Rate
    required: false
    unit: rate
    description: Customer annual rate divided by 12 and converted from percent to decimal.

outputs:
  - name: monthlyPayment
    type: number
    label: Monthly Installment
    required: true
    unit: currency
    description: Level monthly annuity installment.

  - name: paymentCount
    type: integer
    label: Payment Count
    required: true
    unit: count
    description: Number of scheduled monthly repayments.

  - name: totalPaid
    type: number
    label: Total Paid
    required: true
    unit: currency
    description: Published tariff notice (Hirdetmény) total including packaged fees when taken from the representative example.

  - name: thmPct
    type: number
    label: THM
    required: false
    unit: percent
    description: Published total cost of credit indicator for the representative case.

assumptions:
  - "Customer rate is fixed at 3,00% during state interest subsidy (up to 25 years)."
  - "Representative Hirdetmény example uses used-home purchase for a multi-child family in a preferred small settlement, 12.000.000 Ft, 20 years."
  - "Engine schedule uses ACT/360 equal-month interest: interest = principal × r × (365/12) / 360, with paymentRounding forint (ADR 0025) so check-1 installments match §6 at the stated rate."
  - "Representative fee package includes disbursement + appraisal + collateral administration + title-deed extract (2×) + cadastral-map extract + collateral change so engine totalCreditCostFees matches published §6."
  - "Other subsidized and market productCodes are separate catalog entries."

ui:
  formTitle: OTP Home-Creation Loan — Village CSOK (Falusi CSOK / Otthonteremtési Lakáshitel)
  sections:
    - id: falusi-csok-core
      title: Loan Inputs
      fieldNames:
        - principal
        - annualInterestRatePct
        - transactionalAnnualRatePct
        - termMonths
        - startDate
        - loanPurpose

exampleRefs:
  - ./examples/hirdetmeny-representative-used-home.yaml
