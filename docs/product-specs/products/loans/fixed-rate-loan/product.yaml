specVersion: v2alpha1
kind: financial-product
id: loan.fixed-rate.standard
family: loan
variant: fixed-rate
productCode: fixed-rate-standard
displayName: Fixed Rate Loan
description: Standard amortizing fixed-rate loan with equal monthly payments.

engine:
  instrumentType: loan
  rateType: fixed
  amortizationType: level-payment
  paymentFrequency: monthly
  interestDayCountConvention: "30/360"
  paymentRounding: none

subsidy:
  type: none

discounts: []
fees: []
eligibilityRules: []

inputs:
  - name: principal
    type: number
    label: Principal
    required: true
    unit: currency
    description: Initial borrowed amount used for amortization.
    constraints:
      minimum: 1

  - name: annualInterestRatePct
    type: number
    label: Annual Interest Rate
    required: true
    unit: percent
    description: Nominal annual fixed interest rate in percent.
    constraints:
      minimum: 0
      maximum: 100

  - name: termMonths
    type: integer
    label: Term in Months
    required: true
    unit: months
    description: Total contractual term in months, including any optional grace period.
    constraints:
      minimum: 1

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Date the loan starts and interest begins to accrue.

  - name: gracePeriodMonths
    type: integer
    label: Grace Period (Months)
    required: false
    unit: months
    description: Optional months at the start before amortizing repayments begin. Defaults to 0.
    constraints:
      minimum: 0

  - name: capitalizeInterestAtGraceEnd
    type: boolean
    label: Capitalize Interest at End of Grace
    required: false
    description: With a positive grace period, adds unpaid grace interest to principal at grace end instead of interest-only payments.

derivedVariables:
  - name: monthlyInterestRate
    type: number
    label: Monthly Interest Rate
    required: false
    unit: rate
    description: Annual interest rate divided by 12 and converted from percent to decimal.

outputs:
  - name: monthlyPayment
    type: number
    label: Monthly Payment
    required: true
    unit: currency
    description: Constant amortizing monthly payment amount after any grace period.

  - name: paymentCount
    type: integer
    label: Payment Count
    required: true
    unit: count
    description: Number of scheduled cash outflow payments across the full lifecycle.

  - name: totalInterest
    type: number
    label: Total Interest
    required: true
    unit: currency
    description: Total interest paid over the full term.

  - name: totalPaid
    type: number
    label: Total Paid
    required: true
    unit: currency
    description: Sum of all payments across the full term.

assumptions:
  - "Payments are monthly and occur on a regular monthly cadence."
  - "Interest rate is fixed for the whole term."
  - "Grace period and end-of-grace interest capitalization are optional and default off."
  - "With grace and capitalization off (default), behavior matches a plain level-payment annuity over the full term."
  - "With grace and capitalization off for interest, grace months are interest-only; remaining months amortize original principal."
  - "With grace and capitalization on, no cash outflows occur during grace; accrued interest is capitalized onto principal with monthly compounding before amortization begins."
  - "No fees, taxes, insurance, or prepayments are included in this product."
  - "engine.interestDayCountConvention is 30/360 (r/12) and paymentRounding is none (ADR 0025)."

ui:
  formTitle: Fixed Rate Loan
  sections:
    - id: loan-core
      title: Loan Inputs
      fieldNames:
        - principal
        - annualInterestRatePct
        - termMonths
        - startDate
    - id: loan-options
      title: Optional Repayment Options
      fieldNames:
        - gracePeriodMonths
        - capitalizeInterestAtGraceEnd

exampleRefs:
  - ./examples/nominal-case.yaml
  - ./examples/grace-interest-only-case.yaml
  - ./examples/grace-capitalize-case.yaml
