title: Hirdetmény representative OTP 1x1 used-home purchase
description: >
  Official representative example from section 6 of the OTP forint home-loan
  Hirdetmény (valid packaging for applications from 2026-04-20; example basis
  dated 2026-04-01): 12.000.000 Ft, 20 years, used-home purchase, OTP 1x1 at
  7,99% fixed for the full term.

