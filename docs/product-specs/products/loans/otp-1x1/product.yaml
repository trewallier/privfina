specVersion: v2alpha1
kind: financial-product
id: mortgage-loan.otp-1x1.standard
family: mortgage-loan
variant: otp-1x1
productCode: otp-1x1
displayName: OTP 1x1 Home Loan (1x1 Lakáshitel)
description: >
  OTP Jelzálogbank market forint home loan with a contractual interest rate
  fixed for the full term (with optional one-time rate reduction). Conditions
  sourced from the OTP published tariff notice (Hirdetmény) effective for
  applications accepted from 2026-04-20 (Lakáshitel H kondíció 2026-04-20).

engine:
  instrumentType: loan
  rateType: fixed
  amortizationType: level-payment
  paymentFrequency: monthly
  interestDayCountConvention: "act/360"
  paymentRounding: forint
  gracePeriodMonths: 0
  interestPeriodMonths: 240

subsidy:
  type: none

loanPurposes:
  - used-home-purchase
  - new-home-purchase
  - construction
  - renovation
  - modernization
  - extension
  - refinancing

pricing:
  rateSettingRule: fixed-for-full-term-with-optional-loyalty-and-employee-discounts
  notes:
    - Contractual interest rate (ügyleti kamat) 7,99% fixed through the end of the term (Hirdetmény 2.1.1, 2026-04-20).
    - THM representative example for used-home purchase without fee discount is 8,6% (12 HUF million / 20 years).
    - Optional 12-month interest-only grace period is available on the product family but is not the representative annuity case.

discounts:
  - name: huseg-szolgaltatas
    type: rate-discount
    value: 120
    unit: bp
    conditions:
      - loyalty-service-income-routing
      - max-discount-band-0-to-1.2-percent
  - name: otp-dijkedvezmenyes-folyositasi-dij-elengedes
    type: fee-waiver
    value: 100
    unit: percent
    conditions:
      - groupama-insurance-conditions-met
      - or-refinancing-purpose
  - name: egyszeri-kamatcsokkentes-dij-elengedes
    type: fee-waiver
    value: 100
    unit: percent
    conditions:
      - promotional-action-active

fees:
  - name: folyositasi-dij
    type: disbursement
    value: 0.75
    unit: percent
    maxAmount: 200000
    timing: upfront
    description: 0,75%, max 200.000 Ft; 100% waived under OTP discounted-fee campaign when insurance conditions are met (or for refinancing).
  - name: hitelbiztositeki-ertek-megallapitas
    type: appraisal
    value: 58765
    unit: amount
    timing: upfront
    description: On-site appraisal for demand under 50 HUF million (base); campaign may cap customer pay at 35.000 Ft.
  - name: azonnali-ertekbecsles
    type: appraisal
    value: 21980
    unit: amount
    timing: upfront
    description: Statistical instant appraisal; waived under OTP discounted-fee campaign for one property.
  - name: fedezetkezelesi-koltseg
    type: property-management
    value: 20000
    unit: amount
    timing: upfront
    description: 20.000 Ft per collateral.
  - name: tulajdoni-lap-lekeres
    type: land-registry
    value: 9600
    unit: amount
    timing: upfront
    description: >
      Certified electronic title-deed extract (4.800 Ft/property × 2 requests — underwriting + disbursement)
      for one collateral in the §6 representative packaging.
  - name: terkepmasolat-lekeres
    type: land-registry
    value: 5000
    unit: amount
    timing: upfront
    description: >
      Cadastral-map extract fee (5.000 Ft/property) assumed for one detached-house
      collateral in the §6 representative packaging.
  - name: fedezetvaltozasi-koltseg
    type: land-registry
    value: 10600
    unit: amount
    timing: upfront
    description: >
      Collateral change fee (10.600 Ft/collateral/mortgage) for mortgage release;
      included in Hirdetmény §6 total credit-cost fees / THM packaging.
  - name: egyszeri-kamatcsokkentes-dij
    type: other
    value: 2
    unit: percent
    maxAmount: 200000
    timing: upfront
    description: 2%, max 200.000 Ft at contract; waived under one-time rate-reduction fee-waiver campaign for OTP 1x1.
  - name: elotorlesztesi-dij
    type: prepayment
    value: 1.5
    unit: percent
    timing: on-event
    description: 1,5% on or within a rate period.
  - name: szerzodesmodositasi-dij
    type: contract-modification
    value: 51850
    unit: amount
    timing: on-event
    description: Flat contract modification fee (e.g. prolongation).

eligibilityRules:
  - Mortgage collateral on residential real estate is required.
  - Property insurance meeting lender conditions is required.
  - Optional loyalty rate discount requires qualifying income routed to OTP repayment and/or linked retail accounts.

inputs:
  - name: principal
    type: number
    label: Loan Principal
    required: true
    unit: currency
    description: Approved forint principal disbursed for the home-loan purpose.
    constraints:
      minimum: 1

  - name: annualInterestRatePct
    type: number
    label: Contractual Annual Interest Rate
    required: true
    unit: percent
    description: Fixed contractual interest rate for the full term before optional loyalty/employee discounts.
    constraints:
      minimum: 0
      maximum: 100
      enum: [7.99]

  - name: termMonths
    type: integer
    label: Term in Months
    required: true
    unit: months
    description: Full contractual term in months.
    constraints:
      minimum: 12
      maximum: 480

  - name: startDate
    type: string
    label: Start Date
    required: true
    unit: date
    description: Loan start date in ISO format.

  - name: loanPurpose
    type: string
    label: Loan Purpose
    required: true
    description: Purpose code affecting fees and THM presentation.
    constraints:
      enum:
        - used-home-purchase
        - new-home-purchase
        - construction
        - renovation
        - modernization
        - extension
        - refinancing

derivedVariables:
  - name: monthlyInterestRate
    type: number
    label: Monthly Interest Rate
    required: false
    unit: rate
    description: Annual contractual rate divided by 12 and converted from percent to decimal.

outputs:
  - name: monthlyPayment
    type: number
    label: Monthly Installment
    required: true
    unit: currency
    description: Level monthly annuity installment after any optional grace period.

  - name: paymentCount
    type: integer
    label: Payment Count
    required: true
    unit: count
    description: Number of scheduled monthly repayments.

  - name: totalInterest
    type: number
    label: Total Interest
    required: true
    unit: currency
    description: Total interest paid over the full term (engine annuity path).

  - name: totalPaid
    type: number
    label: Total Paid
    required: true
    unit: currency
    description: Sum of scheduled repayments (engine) or Hirdetmény total including packaged fees when taken from the representative example.

  - name: thmPct
    type: number
    label: THM
    required: false
    unit: percent
    description: Published total cost of credit indicator for the representative case.

assumptions:
  - "Contractual rate is fixed for the full term at 7,99% unless loyalty/employee discounts apply."
  - "Representative Hirdetmény example uses used-home purchase, 12.000.000 Ft, 20 years, annuity repayment, single disbursement, conditions as of 2026-04-01 packaging with 2026-04-20 Hirdetmény product rates."
  - "Optional 12-month interest-only grace exists on the market-loan family but is out of scope for the representative annuity example."
  - "Engine schedule uses ACT/360 equal-month interest: interest = principal × r × (365/12) / 360, with paymentRounding forint (ADR 0025) so check-1 installments match §6 at the stated rate."
  - "Representative fee package includes disbursement + appraisal + collateral administration + title-deed extract (2×) + cadastral-map extract + collateral change so engine totalCreditCostFees matches published §6."
  - "Green, CSOK, and other subsidized constructions are separate productCodes."

ui:
  formTitle: OTP 1x1 Home Loan (1x1 Lakáshitel)
  sections:
    - id: otp-1x1-core
      title: Loan Inputs
      fieldNames:
        - principal
        - annualInterestRatePct
        - termMonths
        - startDate
        - loanPurpose

exampleRefs:
  - ./examples/hirdetmeny-representative-used-home.yaml
