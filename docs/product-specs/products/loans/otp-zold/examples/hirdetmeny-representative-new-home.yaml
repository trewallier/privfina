specVersion: v2alpha1
productId: mortgage-loan.otp-zold.standard
exampleId: hirdetmeny-representative-new-home
title: Hirdetmény representative OTP Zöld new-home purchase
description: >
  Official representative example from section 6 of the OTP forint home-loan
  Hirdetmény (valid packaging for applications from 2026-04-20; example basis
  dated 2026-04-01): 12.000.000 Ft, 20 years, new-home purchase, OTP Zöld at
  7,99% customer rate (8,49% base less 50 bp Zöld kamatkedvezmény).

inputs:
  principal: 12000000
  annualInterestRatePct: 7.99
  termMonths: 240
  startDate: 2026-04-01
  loanPurpose: new-home-purchase

expected:
  paymentCount: 240
  monthlyPayment: 101128
  totalPaid: 24360086
  totalCreditCostFees: 89365
  thmPct: 8.5
  rateType: fixed-for-full-term
  baseContractualAnnualRatePct: 8.49
  contractualAnnualRatePct: 7.99
  greenRateDiscountBp: 50

notes:
  - "Source: Lakáshitel_H_kondicio_20260420, §6 Reprezentatív példák, OTP Zöld Lakáshitel / új lakás vásárlás."
  - "monthlyPayment and totalPaid are the published Hirdetmény figures (installment matches ADR 0025 365/360 + forint rounding at the stated rate; totalPaid includes 89.365 Ft fee/cost component)."
  - "Verification (ADR 0024 / 0025): (1) engine installment from amount/term/stated rate with 365-over-360 + forint rounding; (2) law-based THM from these offering repayment + fee numbers; (3) law-based THM from engine-calculated monthly payments + fee package. Do not hide gaps with an invisible packaging-rate adjustment."
